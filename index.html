// Independently written offline fan gameplay prototype. No external assets, requests or copied engine code.
const VERSION=1,W=192,H=144,T=36,BOOKS=[];
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),mini=document.querySelector('#minimap'),mx=mini.getContext('2d');
const $=id=>document.getElementById(id),dist=(a,b)=>Math.abs(a.x-b.x)+Math.abs(a.y-b.y),clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PLACES=[["山腳茶棚", 96, 91, "inn", -1, "向茶棚老人打聽故人的消息。"], ["少室山道", 99, 85, "sage", -1, "山路上遇見挑水僧人與少年。"], ["松林琴臺", 105, 81, "sage", -1, "琴聲引來一位遠方來客。"], ["少林山門", 111, 76, "school", -1, "遠客登門，武學與門規相撞。"], ["山後僻徑", 105, 70, "home", -1, "風波之後，隨覺遠離開。"], ["深山夜舍", 98, 67, "home", -1, "夜深聽經，一段往事走向終點。"]].map((p,i)=>({id:i,name:p[0],x:p[1],y:p[2],type:p[3],book:p[4],desc:p[5]}));
const SKILLS=[{id:'punch',name:'掌勢',power:20,cost:0,range:1,shape:'one',type:'拳掌',desc:'近身掌風；不耗內力'},{id:'sword',name:'劍勢',power:32,cost:8,range:3,shape:'one',type:'劍法',desc:'青色劍光；三格單體'},{id:'heal',name:'調息運氣',power:65,cost:18,range:1,shape:'heal',type:'內息',desc:'碧色氣環；恢復自身氣血'}];
const RECRUITS=[];
let s=null,scene=null,battle=null,path=[],keys={},lastMove=0,lastFrame=0,walk=0,logs=[],cam={x:0,y:0},cw=0,ch=0,mapFull=false,selectedSkill='punch',battleMode='move',animTimer=0,sessionToken=0;
const terrain=new Uint8Array(W*H),road=new Set();let noticeTimer;
function hash(x,y){let n=Math.imul(x+173,374761393)^Math.imul(y+91,668265263);n=Math.imul(n^(n>>>13),1274126177);return (n>>>0)/4294967295}

for(let y=0;y<H;y++)for(let x=0;x<W;x++){
let t=x>waterline(y)?3:0;
if(x<48&&y<109)t=4;if(y<27&&x<154)t=5;
let m=Math.sin(x*.12+y*.08)*Math.cos(x*.067-y*.14);if(t!==3&&m>.66)t=2;else if(t===0&&hash(Math.floor(x/4),Math.floor(y/4))>.62)t=1;
if(y>75&&y<80&&x>52&&x<155)t=3;
terrain[y*W+x]=t;
}
for(const p of PLACES){for(let y=p.y-3;y<=p.y+3;y++)for(let x=p.x-3;x<=p.x+3;x++)if(x>=0&&y>=0&&x<W&&y<H)terrain[y*W+x]=p.x>158?0:(p.y<27?5:p.x<48?4:0)}
// A connected road tree guarantees every mainland settlement is reachable on foot.
function makeRoad(a,b){let x=a.x,y=a.y;while(x!==b.x||y!==b.y){road.add(y*W+x);terrain[y*W+x]=0;if(x!==b.x)x+=Math.sign(b.x-x);else y+=Math.sign(b.y-y)}road.add(y*W+x);terrain[y*W+x]=0}
const mainland=PLACES.filter(p=>p.x<160);let linked=[mainland[0]],todo=mainland.slice(1);while(todo.length){let best,from,cost=Infinity;for(const a of linked)for(const b of todo)if(dist(a,b)<cost){cost=dist(a,b);best=b;from=a}makeRoad(from,best);linked.push(best);todo=todo.filter(p=>p!==best)}

function menu(){if(!s)return welcome();show(`<button class="close" onclick="closeModal()">返回江湖</button><h2>行旅選單</h2><p>${esc(s.name)} · 第 ${s.days} 日 · 已行 ${s.steps} 步</p><div class="cards"><div class="card"><h3>保留旅程</h3><p>移動、事件與戰鬥結束時自動存檔。更換瀏覽器或檔名可能讀不到同一份存檔，請匯出備份。</p><div class="buttons"><button onclick="save()">本機存檔</button><button onclick="exportSave()">匯出存檔</button><button onclick="load()">讀取</button><button onclick="importSave()">匯入存檔</button></div></div><div class="card"><h3>江湖百事</h3><div class="buttons"><button onclick="partyMenu()">隊伍與武學</button><button onclick="journal()">故事進度</button><button onclick="chronicle()">江湖紀事</button><button onclick="help()">操作說明</button><button onclick="about()">版本與來源</button><button onclick="confirmNew()">另啟新局</button></div></div></div>`)}
function confirmNew(){if(battle){notice('請先完成戰鬥。');return}show(`<h2>另啟新局</h2><p>開始後會覆蓋本機自動存檔。可先匯出目前旅程。</p><div class="buttons"><button onclick="exportSave()">先匯出備份</button><button onclick="newGame()">開始新局</button><button onclick="menu()">返回</button></div>`)}

function update(){if(!s)return;document.body.classList.toggle('fighting',!!battle);$('gold').textContent=s.gold;$('rep').textContent=s.rep;$('books').textContent=Math.min(s.chapter||0,8)+' / 8';$('pad').style.display=battle?'none':'grid';$('toolbar').style.display=battle?'none':'flex';$('battleActions').style.display=battle?'block':'none';let near=nearest();$('location').innerHTML=`<strong>${battle?'刀劍棋局':scene?esc(scene.place.name):region(s.x,s.y)}</strong><span class="small">${battle?'點格移動 · 選招攻敵':scene?'走近人物互動 · 由南方出口離開':`第 ${s.days} 日 · 座標 ${s.x}, ${s.y} ${s.boat?'· 已備舟船':''}`}</span>`;$('sideTitle').textContent=battle?'戰況':scene?scene.place.name:'同行俠客';$('sideInfo').innerHTML=s.party.map(u=>`<div class="roster"><div class="row"><b>${esc(u.name)}</b><span class="badge">Lv.${u.level}</span></div><div class="small">氣血 ${u.hp} / ${u.maxhp} · 內力 ${u.mp} / ${u.maxmp}</div><div class="bar"><i style="width:${u.hp/u.maxhp*100}%"></i></div></div>`).join('')+(!scene&&!battle&&near&&dist(s,near)<=5?`<p class="small">附近：${near.name}<br>${near.desc}</p>`:'');if(battle)battleUI();drawMini()}
function region(x,y){return x>158?'東海滄波':y<28?'北國雪原':x<48?'西域大漠':y>108?'南疆山水':y<68?'中原群山':'江南水鄉'}
function nearest(){return PLACES.reduce((a,b)=>dist(s,a)<dist(s,b)?a:b)}
function pass(x,y){if(x<0||y<0||x>=W||y>=H)return false;let t=terrain[y*W+x];return t!==2&&(t!==3||s.boat)}
function findPath(start,end,local=false){let w=local?22:W,h=local?16:H,prev=new Int32Array(w*h).fill(-1),q=[start.y*w+start.x],target=end.y*w+end.x;prev[q[0]]=q[0];for(let i=0;i<q.length;i++){let n=q[i];if(n===target)break;let x=n%w,y=Math.floor(n/w);for(const [dx,dy]of [[1,0],[-1,0],[0,1],[0,-1]]){let a=x+dx,b=y+dy,k=b*w+a;if(a<0||b<0||a>=w||b>=h||prev[k]!==-1||!(local?scenePass(a,b):pass(a,b)))continue;prev[k]=n;q.push(k)}}if(prev[target]===-1)return [];let out=[];for(let n=target;n!==q[0];n=prev[n])out.push({x:n%w,y:Math.floor(n/w)});return out.reverse()}
function go(x,y){if(!s||battle||$('overlay').classList.contains('open'))return;if(scene){if(!scenePass(x,y))return;path=findPath(scene,{x,y},true)}else{if(!pass(x,y)){notice(terrain[y*W+x]===3?'水域需要舟船，請至碼頭購買。':'高山無法通行，請沿道路繞行。');return}path=findPath(s,{x,y});if(!path.length&&dist(s,{x,y})>0)notice('此處無法步行抵達；海外據點需要舟船。')}}
function step(dx,dy){if(!s||battle)return;let p=scene||s,x=p.x+dx,y=p.y+dy;if(scene){if(!scenePass(x,y))return false;p.x=x;p.y=y;if(y>=15){leave();return true}}else{if(!pass(x,y))return false;s.x=x;s.y=y;s.steps++;s.days=1+Math.floor(s.steps/180);for(let place of PLACES)if(dist(s,place)<8&&!s.discovered.includes(place.id))s.discovered.push(place.id);if(s.steps%15===0)save(true)}walk+=.7;update();return true}
function interact(){if(!s||battle||$('overlay').classList.contains('open'))return;if(mapFull){mapFull=false;return}if(scene){const npc=scene.npcs.find(n=>dist(scene,n)<=2);if(npc)talk(npc);else if(scene.y>12)leave();else notice('請走近人物，或從南方出口離開。');return}const p=nearest();if(dist(s,p)>2){notice('走到據點旁兩格內，再按互動。');return}enter(p)}
function enter(p){path=[];scene={place:p,x:11,y:13,npcs:[{x:10,y:6,role:'host',name:hostName(p)},{x:15,y:10,role:'merchant',name:'行腳藥商'},{x:6,y:10,role:'traveler',name:'江湖旅人'}]};log('抵達'+p.name+'。');update()}
function leave(){scene=null;path=[];update();save(true);notice('回到大地圖。')}
function hostName(p){return sceneDesign(p.id).npcs[0].name}
function scenePass(x,y){return x>=1&&x<=20&&y>=1&&y<=15&&!(x>=4&&x<=17&&y>=2&&y<=4)&&!scene.npcs.some(n=>n.x===x&&n.y===y)}

function rest(cost){if(s.gold<cost)return notice('銀兩不足；茶棚可免費歇息。');s.gold-=cost;for(const u of s.party){u.hp=u.maxhp;u.mp=u.maxmp}notice('全隊氣血與內力完全恢復。');update();save(true)}
function buyBoat(){if(s.boat)return;if(s.gold<150)return notice('銀兩不足。');s.gold-=150;s.boat=true;notice('已備舟船，現在可以自由渡海。');closeModal();save(true)}
function shop(){show(`<button class="close" onclick="closeModal()">離開</button><h2>行腳藥商</h2><p>銀兩：<b>${s.gold}</b> · 金創藥 ${s.inventory.herb} · 內息丹 ${s.inventory.qi}</p><div class="cards"><div class="card"><h3>金創藥</h3><p>恢復 100 點氣血並解毒，戰鬥中消耗行動。</p><button onclick="buy('herb',20)">購買一份 · 20 兩</button></div><div class="card"><h3>內息丹</h3><p>恢復 70 點內力，戰鬥中消耗行動。</p><button onclick="buy('qi',30)">購買一份 · 30 兩</button></div></div>`)}
function buy(k,n){if(s.gold<n)return notice('銀兩不足。');s.gold-=n;s.inventory[k]++;shop();update();save(true)}

function partyMenu(i=0){if(!s)return;if(battle){notice('請在戰鬥中使用招式列與藥品。');return}const u=s.party[i];show(`<button class="close" onclick="closeModal()">返回</button><h2>同行與武學</h2><div class="tabs">${s.party.map((a,n)=>`<button class="${n===i?'active':''}" onclick="partyMenu(${n})">${esc(a.name)}</button>`).join('')}</div><div class="cards"><div class="card"><h3>${esc(u.name)} · Lv.${u.level}</h3><div class="stats">氣血 ${u.hp} / ${u.maxhp}<br>內力 ${u.mp} / ${u.maxmp}<br>攻擊 ${u.atk}　防禦 ${u.def}　身法 ${u.speed}<br>經驗 ${u.xp} / ${xpNeed(u)}</div><div class="buttons"><button onclick="fieldItem(${i},'herb')">金創藥 (${s.inventory.herb})</button><button onclick="fieldItem(${i},'qi')">內息丹 (${s.inventory.qi})</button></div></div><div class="card"><h3>武功</h3>${u.skills.map(k=>{let a=SKILLS.find(a=>a.id===k.id);return `<p><b>${a.name} · 第 ${k.lv} 重</b><br>${a.desc}<br><span class="small">修練 ${k.xp} / ${k.lv*4} 次 · 最高十重</span></p>`}).join('')}<p class="small">每次成功施展增加熟練度。升級提升氣血、內力與攻防。等級上限 30。</p></div></div>`)}
function fieldItem(i,k){let u=s.party[i];if(!s.inventory[k])return notice('藥品不足。');if(k==='herb'&&u.hp===u.maxhp||k==='qi'&&u.mp===u.maxmp)return notice('目前不需要使用。');s.inventory[k]--;if(k==='herb')u.hp=Math.min(u.maxhp,u.hp+100);else u.mp=Math.min(u.maxmp,u.mp+70);partyMenu(i);update();save(true)}

function routePlace(id){if(battle)return notice('戰鬥中無法尋路。');if(scene)scene=null;mapFull=false;closeModal();const p=PLACES[id];go(p.x,p.y);if(path.length)notice('沿道路前往'+p.name+'；方向鍵可隨時中斷。')}
function atlas(){if(!s||battle)return;closeModal();if(scene)scene=null;mapFull=!mapFull;path=[];update();notice(mapFull?'天下圖：點據點尋路，再按「天下圖」關閉。':'回到行旅視角。')}
function xpNeed(u){return 60+u.level*35}
function addXp(u,xp){u.xp+=xp;while(u.xp>=xpNeed(u)&&u.level<30){u.xp-=xpNeed(u);u.level++;u.maxhp+=26;u.hp=Math.min(u.maxhp,u.hp+65);u.maxmp+=14;u.mp=Math.min(u.maxmp,u.mp+25);u.atk+=6;u.def+=3;u.speed++;log(u.name+' 提升至 '+u.level+' 級。')}}
// Tactical battle: each actor may move once and act once. One ordered initiative queue.
function startFight(kind='school',id=2){if(battle)return;save(true);closeModal();lights=[];path=[];let hero={...JSON.parse(JSON.stringify(s.party[0])),team:0,origin:0,x:1,y:2,alive:true,moved:false,poison:0};let e={...unit('練招木人','punch',1),team:1,x:8,y:2,alive:true,moved:false,poison:0};e.hp=e.maxhp=110;e.atk=12;battle={kind:'practice',place:PLACES[id],units:[hero,e],queue:[],turn:0,round:0,active:null,busy:false,obstacles:new Set(['5,2','5,6','4,4','6,4']),float:[],result:null};selectedSkill='sword';battleMode='move';mapFull=false;newRound();update()}

function newRound(){if(!battle)return;battle.round++;battle.queue=battle.units.filter(u=>u.alive).sort((a,b)=>b.speed-a.speed||a.team-b.team);battle.turn=0;activate()}
function activate(){if(!battle||checkBattle())return;if(battle.turn>=battle.queue.length){newRound();return}let u=battle.queue[battle.turn];if(!u.alive){battle.turn++;activate();return}battle.active=u;u.moved=false;u.turnStart={x:u.x,y:u.y};battle.busy=u.team===1;selectedSkill=u.skills[0].id;battleMode='move';if(u.poison>0){u.poison--;damage(u,9,'毒');if(checkBattle())return;if(!u.alive){battle.turn++;activate();return}}update();if(u.team===1){let ref=battle,token=sessionToken;setTimeout(()=>{if(battle===ref&&token===sessionToken)enemyTurn()},420)}}
function checkBattle(){if(!battle)return true;if(battle.finishing)return true;let win=!battle.units.some(u=>u.team===1&&u.alive),lose=!battle.units.some(u=>u.team===0&&u.alive);if(win||lose){let b=battle;b.finishing=true;b.busy=true;setTimeout(()=>{if(battle===b)endBattle(win)},850);return true}return false}
function endTurn(){if(!battle)return;let b=battle;b.busy=true;setTimeout(()=>{if(battle!==b)return;b.turn++;activate()},850)}
function at(x,y){return battle.units.find(u=>u.alive&&u.x===x&&u.y===y)}
function tileFree(x,y,u){return x>=0&&y>=0&&x<11&&y<9&&!battle.obstacles.has(x+','+y)&&(!at(x,y)||at(x,y)===u)}
function reachable(u,max=3){let q=[{x:u.x,y:u.y,d:0}],seen=new Map([[u.x+','+u.y,0]]);for(let i=0;i<q.length;i++){let p=q[i];if(p.d===max)continue;for(const [dx,dy]of [[1,0],[-1,0],[0,1],[0,-1]]){let x=p.x+dx,y=p.y+dy,k=x+','+y;if(!tileFree(x,y,u)||seen.has(k))continue;seen.set(k,p.d+1);q.push({x,y,d:p.d+1})}}return seen}
function battleUI(){if(!battle)return;const u=battle.active;if(!u)return;let skill=SKILLS.find(k=>k.id===selectedSkill);$('battleActions').innerHTML=`<div class="row"><b>第 ${battle.round} 回合 · ${esc(u.name)} ${u.team?'行動中…':''}</b><span class="small">${u.hp} 氣血 / ${u.mp} 內力</span></div>${u.team?'<div class="small">敵方正在思考。</div>':`<div class="buttons"><button class="${battleMode==='move'?'active':''}" onclick="setBattleMode('move')">${u.moved?'撤回／重選移動':'移動'}</button>${u.skills.map(k=>{let a=SKILLS.find(a=>a.id===k.id);return `<button class="${battleMode==='skill'&&selectedSkill===a.id?'active':''}" ${u.mp<a.cost?'disabled':''} onclick="chooseSkill('${a.id}')">${a.name} ${k.lv}重 · ${a.cost}</button>`}).join('')}<button onclick="combatItem('herb')">補血 (${s.inventory.herb})</button><button onclick="combatItem('qi')">補氣 (${s.inventory.qi})</button><button onclick="guard()">休息</button><button onclick="retreat()">撤退</button></div><div class="small">${battleMode==='move'?'點亮格移動；出招前可按「撤回／重選移動」重新選擇。':skill.name+'：'+skill.desc+'；點選'+(skill.shape==='heal'?'隊友':'敵人')+'施展。'}</div>`}`}
function setBattleMode(m){if(!battle||battle.busy||battle.active.team!==0)return;let u=battle.active;if(m==='move'&&u.moved){u.x=u.turnStart.x;u.y=u.turnStart.y;u.moved=false;viewPan={x:0,y:0};notice('已撤回移動，可從本回合起點重選落點。')}battleMode=m;update()}
function chooseSkill(id){if(!battle||battle.busy)return;selectedSkill=id;battleMode='skill';update()}
function battleClick(x,y){if(!battle||battle.busy||$('overlay').classList.contains('open'))return;let u=battle.active;if(u.team)return;if(battleMode==='move'){if(u.moved)return;let r=reachable(u,3);if(!r.has(x+','+y))return notice('無法走到該格，請點亮起的空格。');if(x===u.x&&y===u.y)return;u.x=x;u.y=y;u.moved=true;battleMode='skill';update();return}let target=at(x,y),a=SKILLS.find(a=>a.id===selectedSkill);if(!target)return notice('請點選有效目標。');if(a.shape==='heal'?target.team!==u.team:target.team===u.team)return notice('此招不能對該目標使用。');if(dist(u,target)>a.range)return notice('距離太遠，先移動靠近。');if(u.mp<a.cost)return notice('內力不足。');perform(u,target,a);if(!checkBattle())endTurn()}
function perform(u,target,a){castLight(u,target,a);u.mp-=a.cost;let training=u.skills.find(k=>k.id===a.id),lv=training?.lv||1;if(a.shape==='heal'){let amount=a.power+u.level*6+lv*5;target.hp=Math.min(target.maxhp,target.hp+amount);target.poison=0;floatText(target,'+'+amount,'#b5e3b3');log(u.name+' 運氣調息。')}else{let targets=a.shape==='sweep'?battle.units.filter(v=>v.alive&&v.team!==u.team&&dist(v,target)<=1):[target];for(let v of targets){let value=Math.max(6,Math.round((u.atk+a.power+lv*5-v.def)*(v===target?1:.65)));damage(v,value,a.name)}log(u.name+' 施展 '+a.name+'。')}if(training){training.xp++;if(training.xp>=training.lv*4&&training.lv<10){training.xp=0;training.lv++;log(u.name+' 的 '+a.name+' 提升至第 '+training.lv+' 重。')}}}
function damage(u,n,label){u.hp=Math.max(0,u.hp-n);floatText(u,'−'+n,u.team?'#f1c185':'#e29b90');if(u.hp<=0){u.alive=false;log(u.name+' 退場。')}}
function floatText(u,t,color){battle.float.push({x:u.x,y:u.y,text:t,color,life:1.3})}
function enemyTurn(){if(!battle)return;let u=battle.active;if(!u||u.team!==1||!u.alive)return;let enemies=battle.units.filter(v=>v.alive&&v.team===0),target=enemies.sort((a,b)=>dist(u,a)-dist(u,b)||a.hp-b.hp)[0];if(!target)return checkBattle();let reach=reachable(u,3),spots=Array.from(reach.keys()).map(k=>{let [x,y]=k.split(',').map(Number);return {x,y}}).sort((a,b)=>dist(a,target)-dist(b,target));u.x=spots[0].x;u.y=spots[0].y;let options=u.skills.map(k=>SKILLS.find(a=>a.id===k.id)).filter(a=>a.shape!=='heal'&&a.cost<=u.mp&&a.range>=dist(u,target)).sort((a,b)=>b.power-a.power);if(options.length)perform(u,target,options[0]);else{u.mp=Math.min(u.maxmp,u.mp+14);floatText(u,'調息','#a7c6c2')}if(!checkBattle())endTurn()}
function combatItem(k){if(!battle||battle.busy)return;let u=battle.active;if(!s.inventory[k])return notice('藥品不足。');if(k==='herb'&&u.hp===u.maxhp||k==='qi'&&u.mp===u.maxmp)return notice('目前無須使用。');s.inventory[k]--;if(k==='herb'){u.hp=Math.min(u.maxhp,u.hp+100);u.poison=0;floatText(u,'+100','#b5e3b3')}else{u.mp=Math.min(u.maxmp,u.mp+70);floatText(u,'+70 內','#b5d3df')}endTurn()}
function guard(){if(!battle||battle.busy)return;let u=battle.active;u.mp=Math.min(u.maxmp,u.mp+22);u.hp=Math.min(u.maxhp,u.hp+10);floatText(u,'調息','#a7c6c2');endTurn()}
function retreat(){if(battle&&!battle.busy)endBattle(false)}
let lights=[];
function castLight(u,target,a){lights.push({sx:u.x,sy:u.y,tx:target.x,ty:target.y,id:a.id,name:a.name,life:0,duration:1.15});}
function drawLights(dt,g){
ctx.save();ctx.globalCompositeOperation='lighter';
for(const f of lights){f.life+=dt;let t=f.life/f.duration;if(t>=1)continue;
let source=iso(g,f.sx,f.sy),target=iso(g,f.tx,f.ty),sx=source.x,sy=source.y-g.t*.5,tx=target.x,ty=target.y-g.t*.5;
let colors={punch:'#ffbd75',sword:'#89e4ff',blade:'#ff794b',finger:'#ffd95e',dragon:'#ffcf62',six:'#b5c7ff',nine:'#dab0ff',heal:'#79ffb4'},c=colors[f.id],q=Math.min(1,t/.42),x=sx+(tx-sx)*q,y=sy+(ty-sy)*q,R=g.t;
ctx.globalAlpha=Math.min(1,(1-t)*3);ctx.shadowColor=c;ctx.shadowBlur=15;ctx.strokeStyle=c;ctx.fillStyle=c;
const line=(ax,ay,bx,by,w=2)=>{ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(bx,by);ctx.stroke()};
const ring=(px,py,r,flat=1)=>{ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(px,py,Math.max(1,r),Math.max(1,r*flat),0,0,7);ctx.stroke()};
const glow=(px,py,r)=>{let gr=ctx.createRadialGradient(px,py,0,px,py,r);gr.addColorStop(0,'#ffffffe0');gr.addColorStop(.2,c+'a0');gr.addColorStop(1,c+'00');ctx.fillStyle=gr;ctx.beginPath();ctx.arc(px,py,r,0,7);ctx.fill();ctx.fillStyle=c};
const blade=(px,py,angle,len)=>{ctx.save();ctx.translate(px,py);ctx.rotate(angle);ctx.beginPath();ctx.moveTo(0,-len);ctx.lineTo(3,0);ctx.lineTo(0,6);ctx.lineTo(-3,0);ctx.closePath();ctx.fill();line(-6,2,6,2,1);ctx.restore()};
switch(f.id){
case 'punch':for(let i=0;i<3;i++)ring(x-i*(tx-sx)*.05,y-i*(ty-sy)*.05,R*(.12+i*.09),.65);if(t>.4){for(let i=0;i<12;i++){let a=i*Math.PI/6;line(tx+Math.cos(a)*R*.18,ty+Math.sin(a)*R*.18,tx+Math.cos(a)*R*t,ty+Math.sin(a)*R*t,3)}}glow(x,y,R*.45);break;
case 'sword':for(let i=0;i<4;i++){let off=(i-1.5)*6;line(sx,sy+off,x,y+off,1+i*.5)}blade(x,y,Math.atan2(ty-sy,tx-sx)+Math.PI/2,R*.7);if(t>.45){line(tx-R*t,ty+R*t,tx+R*t,ty-R*t,3);glow(tx,ty,R*.5)}break;

function diamond(g,x,y,fill,stroke){let p=iso(g,x,y);ctx.beginPath();ctx.moveTo(p.x,p.y-g.t*.5);ctx.lineTo(p.x+g.t,p.y);ctx.lineTo(p.x,p.y+g.t*.5);ctx.lineTo(p.x-g.t,p.y);ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=.7;ctx.stroke()}}
function prism(g,x,y,height,top,left,right){let p=iso(g,x,y),t=g.t;ctx.fillStyle=left;ctx.beginPath();ctx.moveTo(p.x-t,p.y);ctx.lineTo(p.x,p.y+t*.5);ctx.lineTo(p.x,p.y+t*.5-height);ctx.lineTo(p.x-t,p.y-height);ctx.closePath();ctx.fill();ctx.fillStyle=right;ctx.beginPath();ctx.moveTo(p.x,p.y+t*.5);ctx.lineTo(p.x+t,p.y);ctx.lineTo(p.x+t,p.y-height);ctx.lineTo(p.x,p.y+t*.5-height);ctx.closePath();ctx.fill();diamond({...g,y:g.y-height},x,y,top,'#20392d55')}
function isoBuilding(x,y,type,scale=1){ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);let g={x:0,y:0,t:29};ctx.fillStyle='#0d201c40';ctx.beginPath();ctx.ellipse(14,9,40,12,0,0,7);ctx.fill();prism(g,0,0,28,'#d3c7a4','#b39f7a','#8b8565');ctx.fillStyle='#413e30';ctx.beginPath();ctx.moveTo(6,-13);ctx.lineTo(15,-18);ctx.lineTo(15,7);ctx.lineTo(6,11);ctx.closePath();ctx.fill();let roof=type==='school'||type==='final'?'#785144':'#465d54';ctx.fillStyle=roof;ctx.beginPath();ctx.moveTo(-38,-25);ctx.lineTo(-6,-54);ctx.lineTo(39,-29);ctx.lineTo(5,-12);ctx.closePath();ctx.fill();ctx.strokeStyle='#c3b284';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(-38,-25);ctx.lineTo(5,-12);ctx.lineTo(39,-29);ctx.stroke();ctx.strokeStyle='#172e2855';ctx.lineWidth=1;for(let i=0;i<7;i++){ctx.beginPath();ctx.moveTo(-6+i*5,-53+i*3);ctx.lineTo(-34+i*6,-24+i*1.7);ctx.stroke()}for(let i=0;i<3;i++){ctx.fillStyle=i%2?'#aaa78a':'#c6bea0';ctx.beginPath();ctx.moveTo(4,13+i*3);ctx.lineTo(19,5+i*3);ctx.lineTo(24,8+i*3);ctx.lineTo(9,16+i*3);ctx.closePath();ctx.fill()}for(let k of [-1,1]){ctx.fillStyle='#c67945';ctx.fillRect(k*22,-19,4,7);let gr=ctx.createRadialGradient(k*22+2,-15,0,k*22+2,-15,12);gr.addColorStop(0,'#ffce7770');gr.addColorStop(1,'#ffce7700');ctx.fillStyle=gr;ctx.fillRect(k*22-10,-27,24,24)}ctx.restore()}

drawScene=function(){let g=sceneGeometry();ctx.fillStyle='#253c30';ctx.fillRect(0,0,cw,ch);let objects=[];for(let y=0;y<16;y++)for(let x=0;x<22;x++){let paved=x>3&&x<18&&y>4&&y<13;diamond(g,x,y,paved?((x+y)%2?'#b2ac8b':'#a39e81'):'#78956d',paved?'#63725955':null);let q=iso(g,x,y);if((x===0||x===21)&&y<14){prism(g,x,y,g.t*.9,'#a5aa90','#7b856c','#586a57')}if((x===2||x===19)&&y%4===1)objects.push({depth:x+y,draw:()=>tree(q.x,q.y,0)})}let house=iso(g,10,4);objects.push({depth:14,draw:()=>isoBuilding(house.x,house.y,scene.place.type,Math.max(.8,g.t/11))});for(let n of scene.npcs){let q=iso(g,n.x,n.y);objects.push({depth:n.x+n.y,draw:()=>{person(q.x,q.y,n.role==='host'?'#805347':n.role==='merchant'?'#8b7948':'#3e6476',0,Math.max(.55,g.t/22));textAt(n.name,q.x,q.y-36,11,'#ffe6af')}})}let q=iso(g,scene.x,scene.y);objects.push({depth:scene.x+scene.y+.1,draw:()=>{ctx.strokeStyle='#f5d78a';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(q.x,q.y+3,g.t*.42,g.t*.18,0,0,7);ctx.stroke();person(q.x,q.y,'#b66f72',walk,Math.max(.55,g.t/22));textAt('郭襄',q.x,q.y-g.t*1.9,13,'#ffe8b5')}});objects.sort((a,b)=>a.depth-b.depth).forEach(o=>o.draw());let exit=iso(g,11,15);textAt('出口',exit.x,exit.y+14,12,'#ffe6af');vignette()};

ctx.fillStyle='#b9a37c';ctx.fillRect(-19,-23,38,24);ctx.fillStyle=kind==='tent'?'#aa7353':'#62775d';ctx.beginPath();ctx.moveTo(-24,-22);ctx.lineTo(0,-47);ctx.lineTo(25,-22);ctx.closePath();ctx.fill();ctx.fillStyle='#594e39';ctx.fillRect(-5,-19,10,20)}else if(kind==='pond'){ctx.fillStyle='#5c9390';ctx.beginPath();ctx.ellipse(0,0,25,11,0,0,7);ctx.fill();ctx.strokeStyle='#d0d7ac';ctx.stroke()}else if(kind==='well'||kind==='pot'||kind==='jar'||kind==='barrel'){ctx.fillStyle=kind==='well'?'#9b9e87':'#99734e';ctx.fillRect(-11,-19,22,19);ctx.beginPath();ctx.ellipse(0,-19,11,5,0,0,7);ctx.fill();ctx.fillStyle='#3c4838';ctx.beginPath();ctx.ellipse(0,-19,7,3,0,0,7);ctx.fill();ctx.strokeStyle='#c5b78a';ctx.strokeRect(-11,-14,22,10)}else{ctx.fillStyle='#886a44';ctx.fillRect(-18,-13,36,12);ctx.fillRect(-15,-2,3,9);ctx.fillRect(13,-2,3,9);ctx.fillStyle=kind==='scroll'?'#dfd2ac':'#b4a57b';ctx.fillRect(-13,-17,25,5);if(kind==='weapon'){ctx.strokeStyle='#c3d4cf';ctx.lineWidth=2;for(let i=-10;i<=10;i+=10){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i+9,-35);ctx.stroke()}}}ctx.restore()}
function npcArt(g,n){let q=iso(g,n.x,n.y),scale=Math.max(.55,g.t/22),colors=['#334d6b','#7d4c41','#557148','#89724d','#526d71','#6b4c73','#b5aa85','#513f32'];person(q.x,q.y,colors[n.look%8],0,scale);ctx.save();ctx.translate(q.x,q.y);ctx.scale(scale,scale);if(n.look%3===0){ctx.fillStyle='#b7a879';ctx.beginPath();ctx.moveTo(-10,-34);ctx.lineTo(0,-43);ctx.lineTo(10,-34);ctx.closePath();ctx.fill()}else if(n.look%3===1){ctx.fillStyle='#d0c2a0';ctx.fillRect(-5,-36,10,3)}else{ctx.strokeStyle='#322e28';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-4,-32);ctx.lineTo(-7,-15);ctx.stroke()}ctx.restore();textAt(n.name,q.x,q.y-42*scale,14,'#fff0c3');if(s&&CHAPTERS[s.chapter]?.npc===n.name&&CHAPTERS[s.chapter]?.area===scene.place.id){textAt('◆',q.x,q.y-56*scale+Math.sin(lastFrame*.003)*4,20,'#ffe48b')}}
drawScene=function(){let g=sceneGeometry(),d=scene.design||sceneDesign(scene.place.id),id=scene.place.id,theme=d.theme;ctx.fillStyle=theme[0];ctx.fillRect(0,0,cw,ch);let objects=[];for(let y=0;y<16;y++)for(let x=0;x<22;x++){let lane=x===11||y===12||y===7||((x+id)%7===0&&y>4);diamond(g,x,y,lane?theme[1]:theme[0],lane?'#152b2525':null);let q=iso(g,x,y);if((x===0||x===21)&&y<14&&['temple','fortress','capital'].includes(STORIES[id][1]))prism(g,x,y,g.t*.8,'#a0a38a','#6c775e','#55634f');if(!lane&&hash(x+id,y)>.85){ctx.strokeStyle='#e6dfae20';ctx.beginPath();ctx.moveTo(q.x-4,q.y);ctx.lineTo(q.x+5,q.y-2);ctx.stroke()}}for(let h of d.houses){let q=iso(g,h.x,h.y);objects.push({depth:h.x+h.y,draw:()=>isoBuilding(q.x,q.y,h.type,Math.max(.8,g.t/16))})}for(let p of d.props)objects.push({depth:p.x+p.y,draw:()=>sceneryProp(g,p)});for(let n of scene.npcs)objects.push({depth:n.x+n.y+.1,draw:()=>npcArt(g,n)});let q=iso(g,scene.x,scene.y);objects.push({depth:scene.x+scene.y+.2,draw:()=>{ctx.strokeStyle='#f5d78a';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(q.x,q.y+3,g.t*.42,g.t*.18,0,0,7);ctx.stroke();person(q.x,q.y,'#b66f72',walk,Math.max(.55,g.t/22));textAt('郭襄',q.x,q.y-g.t*1.9,13,'#ffe8b5')}});objects.sort((a,b)=>a.depth-b.depth).forEach(o=>o.draw());if(['snow','volcano','island','summit'].includes(STORIES[id][1])){ctx.fillStyle=STORIES[id][1]==='volcano'?'#f5a15c90':'#ecedd09a';for(let i=0;i<26;i++){let px=(hash(i,id)*cw+lastFrame*.009)%cw,py=(hash(id,i)*ch+lastFrame*.018)%ch;ctx.fillRect(px,py,2,2)}}let e=iso(g,11,15);textAt('出口',e.x,e.y+16,13,'#ffe7b0');vignette()};

function frame(now){requestAnimationFrame(frame);try{if(cw<=1||ch<=1)size();cameraControls();const dt=Math.min(.1,(now-lastFrame)/1000||0);lastFrame=now;if(s){if(!$('overlay').classList.contains('open')&&!battle&&!mapFull&&now-lastMove>105){let dx=(keys.ArrowRight||keys.d||padHold?.dx===1?1:0)-(keys.ArrowLeft||keys.a||padHold?.dx===-1?1:0),dy=(keys.ArrowDown||keys.s||padHold?.dy===1?1:0)-(keys.ArrowUp||keys.w||padHold?.dy===-1?1:0);if(dx||dy){path=[];step(dx,dx?0:dy);lastMove=now}else if(path.length){let p=path.shift(),from=scene||s;step(p.x-from.x,p.y-from.y);lastMove=now}}
ctx.clearRect(0,0,cw,ch);if(battle)drawBattle(dt);else if(mapFull)drawAtlas();else if(scene)drawScene();else drawWorld();}else{ctx.fillStyle='#17312b';ctx.fillRect(0,0,cw,ch);for(let i=0;i<12;i++)mountain(cw*.1+i*70,ch*.6+Math.sin(i)*30,0,i)}$('renderError').style.display='none';}catch(err){renderFailure(err)}}
function tapGame(e){if(!s||$('overlay').classList.contains('open'))return;let r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;if(battle){let a=battleGeometry();let hit=uniso(a,x,y);if(battleMode==='skill'){let skill=SKILLS.find(k=>k.id===selectedSkill),candidates=battle.units.filter(v=>v.alive&&(skill.shape==='heal'?v.team===battle.active.team:v.team!==battle.active.team));let picked=pickFigure(a,x,y,candidates);if(picked)hit=picked}battleClick(hit.x,hit.y);return}if(mapFull){let a=atlasGeometry(),p={x:(x-a.x)/a.scale,y:(y-a.y)/a.scale},nearest=PLACES.reduce((a,b)=>dist(p,a)<dist(p,b)?a:b);if(dist(p,nearest)<9)routePlace(nearest.id);return}if(scene){let a=sceneGeometry(),hit=uniso(a,x,y),tx=hit.x,ty=hit.y;let n=pickFigure(a,x,y,scene.npcs)||scene.npcs.find(n=>n.x===tx&&n.y===ty);if(n){if(dist(scene,n)<=2)talk(n);else{let opts=[[1,0],[-1,0],[0,1],[0,-1]].map(([dx,dy])=>({x:n.x+dx,y:n.y+dy})).filter(p=>scenePass(p.x,p.y));opts.sort((a,b)=>dist(scene,a)-dist(scene,b));if(opts.length)go(opts[0].x,opts[0].y)}}else if(tx>=0&&tx<22&&ty>=0&&ty<16)go(tx,ty);return}let hit=uniso(worldGeometry(),x,y),tx=hit.x,ty=hit.y,place=PLACES.find(p=>Math.abs(tx-p.x)<=1&&Math.abs(ty-p.y)<=1);if(place&&dist(s,place)<=2)enter(place);else if(place)go(place.x,place.y);else if(tx>=0&&ty>=0&&tx<W&&ty<H)go(tx,ty)}

function pickFigure(g,x,y,people){return people.map(v=>{let p=iso(g,v.x,v.y),dx=x-p.x,dy=y-(p.y-g.t*.6);return {v,score:(dx/(Math.max(24,g.t*.6)))**2+(dy/Math.max(30,g.t*.95))**2}}).filter(a=>a.score<=1).sort((a,b)=>a.score-b.score)[0]?.v||null}
let dragView=null;
canvas.addEventListener('pointerdown',e=>{if(!s||$('overlay').classList.contains('open'))return;syncCamera();dragView={id:e.pointerId,x:e.clientX,y:e.clientY,px:viewPan.x,py:viewPan.y,moved:false,pan:!!(scene||battle)&&!mapFull};try{canvas.setPointerCapture(e.pointerId)}catch{}});
canvas.addEventListener('pointermove',e=>{if(!dragView||e.pointerId!==dragView.id)return;let dx=e.clientX-dragView.x,dy=e.clientY-dragView.y;if(Math.hypot(dx,dy)>9)dragView.moved=true;if(dragView.moved&&dragView.pan){path=[];viewPan.x=clamp(dragView.px+dx,-1800,1800);viewPan.y=clamp(dragView.py+dy,-1200,1200)}});
canvas.addEventListener('pointerup',e=>{if(!dragView||e.pointerId!==dragView.id)return;let tap=!dragView.moved;dragView=null;if(tap)tapGame(e)});
canvas.addEventListener('pointercancel',()=>dragView=null);
canvas.addEventListener('wheel',e=>{if((scene||battle)&&!mapFull){e.preventDefault();zoomView(e.deltaY<0?1:-1)}},{passive:false});

for(let btn of document.querySelectorAll('[data-dir]')){const [dx,dy]=btn.dataset.dir.split(',').map(Number);btn.setAttribute('aria-label',dx===1?'向右移動':dx===-1?'向左移動':dy===1?'向下移動':'向上移動');btn.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 20V4M5 11L12 4L19 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="rotate('+(dx===1?90:dx===-1?270:dy===1?180:0)+' 12 12)"/></svg>';btn.addEventListener('pointerdown',e=>pressPad(btn,e),{passive:false});btn.addEventListener('pointermove',e=>{if(e.cancelable)e.preventDefault()},{passive:false});for(let type of ['pointerup','pointercancel','lostpointercapture'])btn.addEventListener(type,e=>stopPad(e.pointerId));}

const CHAPTERS=[
{area:0,npc:'茶棚老人',title:'一｜故人何處',goal:'在茶棚向老人打聽神鵰俠的行蹤',pages:[['旁白','少室山下，暮色染上茶棚的簷角。郭襄放下行囊，先望了一眼北去的山道。走過許多城鎮，她問過同一個名字，也聽過許多互不相干的傳聞。這一次，她仍想親自問問。'],['郭襄','老人家，近來可曾見過一位獨臂大俠，身邊或許還有一位白衣女子？'],['茶棚老人','過路客說的神鵰俠，我聽過。可故事傳到茶棚，往往已換了好幾個說法。我沒親眼見過，不能讓姑娘白跑。山上少林寺往來的人多，也許有人知情。'],['郭襄','多謝你肯說實話。沒有消息，也比拿一句傳聞當真要好。我上山問問便是。'],['旁白','你記下少林的方向。山風拂動茶旗，眼前這條路未必通向故人，卻將帶來一場意想不到的相逢。']],end:'已向茶棚老人問訊。前往少室山道，尋找山中人。'},
{area:1,npc:'覺遠',title:'二｜挑水的僧人',goal:'在山道與覺遠交談',pages:[['旁白','山道轉折處，一位僧人挑著沉重的水桶走來，少年張君寶跟在一旁。桶中水面微動，他的腳步卻十分穩定。郭襄認出覺遠，心中生出久別重逢的親切。'],['郭襄','覺遠大師，原來是你！君寶也在。這些年來，你們可好？'],['覺遠','郭姑娘遠道而來。山裡日子清靜，讀書、做事，一日便過去了。姑娘可是來尋人？'],['郭襄','我仍想打聽楊大哥的下落。若寺裡也沒有消息，我便再到別處去。'],['張君寶','我們沒有新的消息。姑娘走了這許多路，先歇一歇吧。'],['旁白','沒有答案，重逢卻讓旅途不再那麼孤單。忽然林間傳來琴音，清越的聲響穿過松枝，與寺中鐘聲並不相同。']],end:'重遇覺遠與張君寶。循琴聲前往松林琴臺。'},
{area:2,npc:'何足道',title:'三｜林間遠客',goal:'循琴聲與何足道相識',pages:[['旁白','琴聲到轉折處忽然停住。松林間坐著一名遠客，神色帶著幾分自負，也有幾分不願向人解釋的孤高。郭襄停下腳步，並不急著打擾。'],['何足道','肯停下來聽的人，倒比急著問我姓名的人少。姑娘也是去少林？'],['郭襄','本來是尋人，如今卻先被琴聲引來了。先生從哪裡來？'],['何足道','崑崙。何足道。這一趟到少林，自有要辦的事情。'],['旁白','談到琴與武學，遠客的興致漸起。郭襄看得出他對自己的本領很有把握；這份把握到了少林山門前，是否還能只算作一場雅興？'],['郭襄','我也要上山。只是寺中規矩多，若話不投機，還望先把事情說明白。']],end:'結識何足道。可先在琴臺木人旁練招，再到少林山門觀察來客。'},
{area:3,npc:'知客僧',title:'四｜山門之內',goal:'在少林山門向知客僧問明來意',pages:[['旁白','山門前，僧人們的神情比山下嚴肅。何足道遠來登門，說話行事自有一股鋒芒。郭襄站在人群之外，聽見原本只是問答的聲音，漸漸有了較量的意味。'],['知客僧','本寺接待遠客，自有禮數。但若要在這裡試探少林武學，也不能只憑幾句話就算了。'],['郭襄','遠客既有來意，何不先讓他說完？若人人只顧門戶的面子，正事反而聽不見了。'],['旁白','話語沒能立刻解開對峙。何足道的本領讓眾人吃驚；覺遠所具的深厚內力，也在這場風波裡顯出不尋常之處。張君寶就在師父身邊，尚不知道下一刻所有目光都將落向自己。']],end:'山門氣氛轉緊。與張君寶交談，觀看少室風波。'},
{area:3,npc:'張君寶',title:'五｜少年出手',goal:'與山門旁的張君寶交談',pages:[['張君寶','我只是跟師父來的。若事情能說清楚，便不用動手了。'],['旁白','局勢卻不由少年心願而定。交手之間，張君寶將曾經學得的拳法使出，令在場之人刮目相看。這不是一場由郭襄替他贏下的戰鬥；你站在她的視角，見證少年顯露天分。'],['郭襄','君寶，留神！'],['旁白','何足道與少林之間的風波有了轉折，新的質問卻隨之而來。眾僧關切的不只是勝負，更是張君寶從何學來武功。寺規像一道看不見的牆，忽然橫在師徒面前。'],['覺遠','君寶，跟著我。'],['旁白','覺遠帶人離開。郭襄眼前掠過山石與樹影，適才的琴聲、掌聲與爭辯都漸遠。少年贏得的驚嘆，沒有換來一條能安心走回去的路。']],end:'少室風波已過。前往山後僻徑與覺遠會合。'},
{area:4,npc:'覺遠',title:'六｜山後長路',goal:'沿山後僻徑尋到覺遠',pages:[['旁白','山後人聲漸息。覺遠奔走之後，神色已與山道相遇時不同。他的步伐仍向前，氣息卻越來越沉。郭襄想要詢問，話到嘴邊又收住。'],['郭襄','大師，先停一停吧。追問也好，規矩也好，總要讓人喘口氣。'],['張君寶','師父，我在這裡。'],['覺遠','前面……找個能歇息的地方。'],['旁白','你們沿僻徑走向深山。此刻沒有名聲與勝負可爭，只有眼前疲憊的老人，需要一個不受打擾的夜晚。']],end:'找到落腳之處。前往深山夜舍。'},
{area:5,npc:'覺遠',title:'七｜夜深聽經',goal:'在夜舍聽覺遠最後的誦念',pages:[['旁白','夜色沉下來，風從石隙間穿過。覺遠在疲憊中低聲誦念，話語一段接著一段。郭襄與張君寶靜靜聽著；無色禪師也在這段因緣之中，聽得各自能領會的內容。'],['郭襄','他念的……不只是尋常經文。'],['旁白','那是覺遠熟記於心的九陽經義。聽者的根基與所悟各不相同，此時沒有人能把它完整變成一本可隨手傳授的秘笈。你所見證的是傳承的分流，而不是一次獲得絕世武功的獎勵。'],['張君寶','師父？'],['旁白','聲音終於停下。覺遠圓寂，少年守在身旁。郭襄原是為尋故人而來，如今卻陪另一個人走到了無可挽回的離別前。山中的夜，比上山時漫長了許多。']],end:'覺遠圓寂。與張君寶告別，完成序章。'},
{area:5,npc:'張君寶',title:'八｜各自的山河',goal:'與張君寶告別',pages:[['郭襄','往後的路，總得繼續走。君寶，你要好好保重。'],['張君寶','郭姑娘也保重。師父教過的，我會記住。'],['旁白','兩人終究走向不同的道路。尋人的心事沒有在少室山得到答案，一場江湖風波卻留下了長遠的回聲。'],['旁白','此後歲月流轉，郭襄與張君寶的人生，各自與峨嵋、武當的傳承相連。這裡尚不是張無忌的時代，而是那個時代來臨之前的源頭。'],['篇章終','少室尋蹤，到此結束。本版可回訪六處場景、重讀已完成事件與練招。俞岱巖、張翠山與屠龍刀的下一章尚未製作；本版不會把預告當成可遊玩內容。']],end:'序章完成。六處場景與木人演練仍可自由回訪。'}
];
let dialogue=null;
function welcome(){show(`<div class="intro"><div><div class="seal">離線單機 · 倚天序章</div><h1 class="hero-title">少室尋蹤</h1><p>一程山路，一曲琴音。<br>從郭襄尋人開始，走進倚天的前史。</p><div class="buttons"><button class="primary" onclick="begin()">從故事開始</button><button onclick="load()">繼續旅程</button><button onclick="importSave()">匯入存檔</button></div></div><div><h3>可玩序章 1.2</h3><p>六處場景 · 八段連續事件<br>郭襄視角 · 棋盤練招 · 三種招式光影</p><p class="small">採用原著開篇事件的簡化改編，對白重新撰寫。戰鬥演練為新增教學。尚非完整小說遊戲，也未使用原版素材。</p><button onclick="help()">操作說明</button></div></div>`)}
function newGame(){begin()}
function begin(){sessionToken++;battle=null;scene=null;lights=[];path=[];mapFull=false;dialogue=null;s={game:'yitian-prologue',version:1,name:'郭襄',chapter:0,area:0,x:96,y:91,steps:0,days:1,gold:100,rep:0,moral:50,boat:false,party:[unit('郭襄','sword',2)],books:[],flags:{},inventory:{herb:6,qi:4},discovered:[0],won:0,ended:false};s.party[0].skills.push({id:'heal',lv:1,xp:0});logs=[];closeModal();enter(PLACES[0]);show(`<div class="tag">序章 · 郭襄視角</div><h2>山路的另一端</h2><p>你是郭襄，正在打聽楊過與小龍女的行蹤。少室山下的茶棚，是這一程的起點。</p><p>點地面行走，靠近人物後點人物或按「互動」。右上可縮放；右下方向鍵可以長按。金色「當前任務」會指引下一位交談對象。</p><button class="primary" onclick="closeModal()">走進茶棚</button>`);save(true)}
function help(){show(`<h2>行走與練招</h2><p>點地面尋路；方向鍵或 WASD 可長按連續移動。靠近人物後按 E、Enter 或「互動」。手機建議橫向遊玩。右上＋／－縮放，回人物可重設鏡頭。</p><p>「行程圖」可前往已開放場景。任務依故事先後解鎖。木人演練不影響原著勝負：每回合三步，攻擊前可撤回移動再選一次；掌勢、劍勢與調息各有不同光影。</p><p>離線檔沒有網路依賴。選單可匯出／匯入存檔；本版存檔與先前群俠版分開。</p><button onclick="s?closeModal():welcome()">返回</button>`)}
function about(){show(`<h2>倚天序章 1.2</h2><p>獨立撰寫的非官方遊戲原型。原著開篇事件經簡化改編，遊戲對白與場景美術自行製作；並非小說逐字重現，也不是智冠或 jynew 移植。</p><p>目前可玩範圍：郭襄在少室山尋人、何足道來訪、少室風波、覺遠圓寂與告別。後續張翠山、張無忌篇尚未實作。</p><button onclick="s?menu():welcome()">返回</button>`)}
function sceneDesign(id){const names=[['茶棚老人','茶棚掌櫃','過路樵夫'],['覺遠','張君寶'],['何足道','練招木人'],['知客僧','張君寶','覺遠','何足道'],['覺遠','張君寶'],['覺遠','張君寶','無色禪師']][id];const houses=id===2||id===4?[]:[{x:6,y:3,type:id===3?'school':'home'},{x:16,y:3,type:id===0?'inn':'sage'}];const props=[];for(let i=0;i<22;i++){let x=2+(i*7+id)%18,y=2+(i*3+id)%11;if(y<5||x===11||y===7||y===12)continue;props.push({x,y,type:[['stall','table','barrel'],['pine','rock','pine'],['bamboo','scroll','pond'],['lantern','incense','banner'],['tree','rock','pine'],['rock','lantern','scroll']][id][i%3]})}let npcs=names.map((name,i)=>({name,x:[10,6,16,14][i],y:[7,10,9,6][i],role:'story',look:[4,6,3,1][i]+id}));return {theme:THEMES[STORIES[id][1]],houses,props:props.filter(p=>!npcs.some(n=>dist(n,p)<2)),npcs}}
enter=function(p){if(p.id>unlocked())return notice('請先完成目前的故事事件。');mapFull=false;path=[];s.area=p.id;s.x=p.x;s.y=p.y;scene={place:p,x:11,y:13,design:sceneDesign(p.id)};scene.npcs=scene.design.npcs;viewPan={x:0,y:0};s.flags['visited'+p.id]=true;update();size();paintNow();save(true);notice(p.desc)};
scenePass=function(x,y){return !!scene&&x>=1&&x<=20&&y>=1&&y<=15&&!scene.design.houses.some(h=>Math.abs(x-h.x)<=1&&Math.abs(y-h.y)<=1)&&!scene.npcs.some(n=>n.x===x&&n.y===y)};
function unlocked(){return [0,1,2,3,3,4,5,5,5][s.chapter]}
function journal(){if(!s)return;show(`<h2>行旅手記</h2><p>目前：${s.chapter<8?CHAPTERS[s.chapter].goal:'少室尋蹤已完成'}</p><div class="cards">${CHAPTERS.map((c,i)=>`<div class="card"><h3>${i<s.chapter?'✓ ':''}${c.title}</h3><p>${i<s.chapter?c.end:i===s.chapter?c.goal:'尚未經歷'}</p>${i<s.chapter?`<button onclick="readEvent(${i},true)">重讀此段</button>`:i===s.chapter?`<button onclick="travel(${c.area})">前往場景</button>`:''}</div>`).join('')}</div><button onclick="closeModal()">返回</button>`)}
function chronicle(){journal()}
atlas=function(){if(!s||battle)return;show(`<h2>少室行程圖</h2><p class="small">本序章為章節區域；選擇已開放地點直接前往。</p><div class="cards">${PLACES.map(p=>`<div class="card"><h3>${p.name}</h3><p>${p.desc}</p><button ${p.id>unlocked()?'disabled':''} onclick="travel(${p.id})">${p.id>unlocked()?'尚未開放':'前往'}</button></div>`).join('')}</div><button onclick="closeModal()">返回</button>`)};
function travel(id){if(battle||!Number.isInteger(id)||id<0||id>unlocked())return;closeModal();enter(PLACES[id])}
leave=function(){atlas()};routePlace=travel;
function talk(n){if(n.name==='練招木人')return show(`<h2>松林練招</h2><p>新增的戰鬥教學，不是原著決鬥。掌勢呈金色震環，劍勢為青色劍光，調息有碧色氣環。勝敗後都會回到琴臺，恢復氣血與內力。</p><button class="primary" onclick="startFight()">開始演練</button><button onclick="closeModal()">離開</button>`);if(n.name==='茶棚掌櫃')return show(`<h2>一盞熱茶</h2><p>掌櫃替你添上熱茶。走山路之前，也該照料自己的身體。</p><button onclick="rest(0)">歇息恢復</button><button onclick="shop()">補充藥品</button><button onclick="closeModal()">告辭</button>`);let c=CHAPTERS[s.chapter];if(c&&c.area===scene.place.id&&c.npc===n.name)return readEvent(s.chapter);let past=CHAPTERS.map((c,i)=>c.area===scene.place.id&&c.npc===n.name&&i<s.chapter?i:-1).reduce((a,b)=>Math.max(a,b),-1);show(`<h2>${esc(n.name)}</h2><p>${n.name==='覺遠'&&s.chapter>=7?'燈火映著安靜的身影。覺遠已然離世，此地留下的是追憶。':n.name==='過路樵夫'?'樵夫提醒你：山路轉折多，別在天黑後獨自亂走。':s.chapter>=8?'往事留在少室山。這裡的重訪不會改變已經發生的告別。':'眼前的人仍有心事。你可以先依手記上的線索，尋找下一位交談對象。'}</p>${past>=0?`<button onclick="readEvent(${past},true)">回想交談</button>`:''}<button onclick="journal()">查看手記</button><button onclick="closeModal()">告辭</button>`)};
function readEvent(id,replay=false){if(!replay&&id!==s.chapter)return;dialogue={id,page:0,replay};dialoguePage()}
function dialoguePage(){if(!dialogue)return;let c=CHAPTERS[dialogue.id],p=c.pages[dialogue.page];show(`<div class="tag">${c.title} · ${dialogue.page+1} / ${c.pages.length}${dialogue.replay?' · 回憶':''}</div><h2>${p[0]}</h2><p style="font-size:19px;line-height:2;min-height:120px">${p[1]}</p><div class="buttons"><button ${dialogue.page===0?'disabled':''} onclick="dialogue.page--;dialoguePage()">上一段</button><button class="primary" onclick="nextDialogue()">${dialogue.page===c.pages.length-1?'讀完此段':'繼續'}</button><button onclick="dialogue=null;closeModal()">稍後再讀</button></div>`)}
function nextDialogue(){if(!dialogue)return;let c=CHAPTERS[dialogue.id];if(++dialogue.page<c.pages.length)return dialoguePage();if(!dialogue.replay&&s.chapter===dialogue.id){s.chapter++;s.rep++;s.ended=s.chapter===8;log(c.end);save(true)}dialogue=null;update();show(`<h2>${s.ended?'少室尋蹤 · 序章完':'行旅手記已更新'}</h2><p>${c.end}</p><div class="buttons"><button class="primary" onclick="closeModal()">留在此地</button><button onclick="atlas()">行程圖</button><button onclick="journal()">手記</button></div>`)}
function endBattle(win){if(!battle)return;let b=battle;battle=null;lights=[];if(win&&!s.flags.practice){s.flags.practice=true;s.won++;s.rep++;addXp(s.party[0],65)}for(let u of s.party){u.hp=u.maxhp;u.mp=u.maxmp}update();save(true);show(`<h2>${win?'演練完成':'收勢休息'}</h2><p>氣血與內力已恢復。這場練習不改變原著人物的勝負與命運。</p><button onclick="closeModal()">回到松林</button><button onclick="startFight()">再練一次</button>`)}
const baseUpdate=update;update=function(){baseUpdate();if(!s)return;let c=CHAPTERS[s.chapter];$('sideInfo').innerHTML+=`<div class="card"><h3>當前任務</h3><p>${c?c.goal:'序章完成，可回訪與演練。'}</p><button onclick="journal()">行旅手記</button></div>`;$('location').innerHTML+=`<div style="color:#f1d48b;margin-top:7px;font-size:13px">${c?c.goal:'少室尋蹤 · 序章完成'}</div>`;};
const baseApply=applySave;applySave=function(d){baseApply(d);enter(PLACES[s.area]);};

window.addEventListener('blur',()=>{keys={};stopPad();if(s&&!battle)save(true)});document.addEventListener('visibilitychange',()=>{keys={};stopPad();if(document.hidden&&s&&!battle)save(true)});window.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.key==='Escape'){if($('overlay').classList.contains('open')){if(s)closeModal()}else menu();return}if($('overlay').classList.contains('open'))return;const k=e.key.length===1?e.key.toLowerCase():e.key;keys[k]=true;if(k==='e'||k==='Enter')interact();if(k==='m')atlas();if(k==='p')partyMenu();if(k==='j')journal()});window.addEventListener('keyup',e=>{keys[e.key.length===1?e.key.toLowerCase():e.key]=false});window.addEventListener('resize',()=>{size();paintNow()});
function renderFailure(err){let node=$('renderError');node.style.display='block';node.textContent='畫面未能完成繪製：'+(err&&err.message?err.message:String(err))+'\n請把這段文字截圖回報；存檔仍可從選單匯出。';}
function paintNow(){try{ctx.clearRect(0,0,cw,ch);if(battle)drawBattle(0);else if(scene)drawScene();else if(s)drawWorld();$('renderError').style.display='none'}catch(err){renderFailure(err)}}
function boot(){size();welcome();paintNow();requestAnimationFrame(frame)}
boot();
if(typeof ResizeObserver!=='undefined')new ResizeObserver(()=>{size();paintNow()}).observe($('stage'));
window.addEventListener('pageshow',()=>{size();paintNow()});

</script></body></html>
