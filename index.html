function show(html,wide=false){path=[];keys={};stopPad();$('modal').innerHTML=html;$('modal').classList.toggle('wide',wide);$('overlay').classList.add('open')}
function closeModal(){$('overlay').classList.remove('open');keys={};stopPad();update()}
function notice(t){$('notice').textContent=t;$('notice').style.opacity=1;clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>$('notice').style.opacity=0,3400)}
function log(t){logs.unshift(t);logs=logs.slice(0,7);$('log').innerHTML=logs.map(t=>`<div>${esc(t)}</div>`).join('')}
function save(silent=false){if(!s)return;if(battle){notice('戰鬥結束後可存檔；戰前進度已自動保存。');return}try{localStorage.setItem('jy-offline-v01',JSON.stringify(s));if(!silent)notice('已儲存在目前瀏覽器。重要進度建議匯出備份。')}catch{if(!silent)notice('此開啟方式無法本機儲存，請使用「匯出存檔」。')}}
function validSave(d){if(!d||d.version!==1||typeof d.name!=='string'||d.name.length>30||!Number.isInteger(d.x)||!Number.isInteger(d.y)||d.x<0||d.x>=W||d.y<0||d.y>=H||!Number.isFinite(d.gold)||d.gold<0||d.gold>1e9||!Number.isFinite(d.rep)||!Number.isInteger(d.days)||!Number.isInteger(d.steps)||typeof d.flags!=='object'||!d.flags||typeof d.boat!=='boolean'||!Array.isArray(d.books)||d.books.some(i=>!Number.isInteger(i)||i<0||i>13)||!Array.isArray(d.discovered)||d.discovered.some(i=>!Number.isInteger(i)||i<0||i>=PLACES.length)||!d.inventory||!['herb','qi'].every(k=>Number.isInteger(d.inventory[k])&&d.inventory[k]>=0&&d.inventory[k]<1e6)||!Array.isArray(d.party)||!d.party.length||d.party.length>6)return false;return d.party.every(u=>typeof u.name==='string'&&u.name.length<=30&&['level','xp','hp','maxhp','mp','maxmp','atk','def','speed'].every(k=>Number.isFinite(u[k])&&u[k]>=0&&u[k]<1e7)&&u.level>=1&&u.level<=30&&u.hp<=u.maxhp&&u.mp<=u.maxmp&&Array.isArray(u.skills)&&u.skills.length>0&&u.skills.every(k=>SKILLS.some(a=>a.id===k.id)&&Number.isInteger(k.lv)&&k.lv>=1&&k.lv<=10&&Number.isFinite(k.xp)&&k.xp>=0))}
function applySave(d){if(!validSave(d))throw Error('格式');sessionToken++;s=d;scene=null;battle=null;path=[];mapFull=false;closeModal();update();notice('讀取成功，繼續闖蕩江湖。')}
function load(){try{let raw=localStorage.getItem('jy-offline-v01');if(!raw){notice('尚無本機存檔，請開始新遊戲或匯入備份。');return}applySave(JSON.parse(raw))}catch{notice('無法讀取本機存檔；可改用匯入 JSON 備份。')}}
function exportSave(){if(!s)return;if(battle){notice('請先完成戰鬥再匯出。');return}const blob=new Blob([JSON.stringify(s,null,2)],{type:'application/json'}),a=document.createElement('a');let url=URL.createObjectURL(blob);a.href=url;a.download='金庸江湖V0.7_存檔.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notice('已匯出存檔。請保留下載的 JSON 檔。')}
function importSave(){$('loadfile').click()}
$('loadfile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>1000000)throw Error();applySave(JSON.parse(await f.text()));save(true)}catch{notice('存檔格式不符或內容損壞，未更動目前進度。')}e.target.value=''};
function menu(){if(!s)return welcome();show(`<button class="close" onclick="closeModal()">返回江湖</button><h2>行旅選單</h2><p>${esc(s.name)} · 第 ${s.days} 日 · 已行 ${s.steps} 步</p><div class="cards"><div class="card"><h3>保留旅程</h3><p>移動、事件與戰鬥結束時自動存檔。更換瀏覽器或檔名可能讀不到同一份存檔，請匯出備份。</p><div class="buttons"><button onclick="save()">本機存檔</button><button onclick="exportSave()">匯出存檔</button><button onclick="load()">讀取</button><button onclick="importSave()">匯入存檔</button></div></div><div class="card"><h3>江湖百事</h3><div class="buttons"><button onclick="partyMenu()">隊伍與武學</button><button onclick="journal()">天書進度</button><button onclick="chronicle()">江湖紀事</button><button onclick="help()">操作說明</button><button onclick="about()">版本與來源</button><button onclick="confirmNew()">另啟新局</button></div></div></div>`)}
function confirmNew(){if(battle){notice('請先完成戰鬥。');return}show(`<h2>另啟新局</h2><p>開始後會覆蓋本機自動存檔。可先匯出目前旅程。</p><div class="buttons"><button onclick="exportSave()">先匯出備份</button><button onclick="newGame()">開始新局</button><button onclick="menu()">返回</button></div>`)}
function help(){show(`<button class="close" onclick="closeModal()">返回</button><h2>闖蕩指南</h2><p>場景與戰鬥可拖曳地面查看四周，右上＋／－縮放，「回人物」重設鏡頭。切換戰鬥角色時鏡頭會自動跟隨。點人物身體即可互動或選為攻擊目標；右上可直接離開場景。本版使用 2.5D 斜角視角，建議手機橫向遊玩。方向鍵沿地圖格線斜向移動；點擊地面會自動繞路前往；方向鍵、WASD 或右下方向盤可以逐格移動。走到據點旁兩格內，按「互動 / 進入」。進入場景後，走近人物並互動。</p><p>建議路線：小村免費療傷 → 南賢領盤纏 → 客棧招募段譽 → 門派修練 → 挑戰鴛鴦山莊或無量山。天下圖中點選據點可設定步行路線，絕非瞬間傳送。海外需要在碼頭購船。</p><p>戰鬥依身法排序。每回合可移動一次，再選武功、藥品或休息；出招前可按「撤回／重選移動」返回回合起點，再選三步內的落點，不會累加移動距離；點敵人出招，點藍色隊友施展回春術。移動後仍可出招。任何角色都可使用兩種藥品，每次耗一回合。傷害受距離、武功等級與防禦影響。</p><p>戰敗或撤退會回到小村並損失少量銀兩，已取得天書與隊友保留。免費療傷、免費門派切磋可反覆使用，沒有永久卡關機制。</p><p class="small">安卓請先下載完整 HTML，使用能執行本機 JavaScript 的瀏覽器 / HTML 檢視器開啟；部分檔案管理器的預覽不會執行遊戲。檔案無外部依賴，但不保證每款 Android 開檔程式相容。建議橫向遊玩。</p>`)}
function about(){show(`<button class="close" onclick="${s?'menu()':'welcome()'}">返回</button><h2>V0.7 · 獨立玩法重製</h2><p>本檔為全新撰寫的單檔離線原型，並未嵌入以下專案的程式或遊戲素材。角色與武功名稱用於非官方致敬；地圖、戰鬥數值、事件文字為本版改編。</p><p>搜尋確認可參考的民間開源專案：</p><p><a href="https://github.com/scarsty/kys-cpp" target="_blank" rel="noopener">scarsty/kys-cpp</a>：C++ 復刻版，README 列出程式授權及金庸題材不得牟利的附加條款，執行時另需資源目錄。</p><p><a href="https://github.com/jynew/jynew" target="_blank" rel="noopener">jynew/jynew</a>：Unity 重製框架，MIT 之外另有社區素材協議。</p><p class="small">查核日期 2026-10-26。尚未找到智冠正式釋出 1996 原版原始碼的官方證據。上述是民間重製，不能當作原版官方授權。外部連結僅供查閱，遊戲本身不會連線。</p><h3>目前未還原的部分</h3><p class="small">原版完整十四書劇情、原版場景佈局、原版美術與音樂、完整物品與武功資料、原版事件判定、完整善惡分支。本版有十四個可完成的改編取書挑戰，但不代表原版十四條故事已製作完成。</p>`)}
function update(){if(!s)return;document.body.classList.toggle('fighting',!!battle);$('gold').textContent=s.gold;$('rep').textContent=s.rep;$('books').textContent=s.books.length+' / 14';$('pad').style.display=battle?'none':'grid';$('toolbar').style.display=battle?'none':'flex';$('battleActions').style.display=battle?'block':'none';let near=nearest();$('location').innerHTML=`<strong>${battle?'刀劍棋局':scene?esc(scene.place.name):region(s.x,s.y)}</strong><span class="small">${battle?'點格移動 · 選招攻敵':scene?'走近人物互動 · 由南方出口離開':`第 ${s.days} 日 · 座標 ${s.x}, ${s.y} ${s.boat?'· 已備舟船':''}`}</span>`;$('sideTitle').textContent=battle?'戰況':scene?scene.place.name:'同行俠客';$('sideInfo').innerHTML=s.party.map(u=>`<div class="roster"><div class="row"><b>${esc(u.name)}</b><span class="badge">Lv.${u.level}</span></div><div class="small">氣血 ${u.hp} / ${u.maxhp} · 內力 ${u.mp} / ${u.maxmp}</div><div class="bar"><i style="width:${u.hp/u.maxhp*100}%"></i></div></div>`).join('')+(!scene&&!battle&&near&&dist(s,near)<=5?`<p class="small">附近：${near.name}<br>${near.desc}</p>`:'');if(battle)battleUI();drawMini()}
function region(x,y){return x>158?'東海滄波':y<28?'北國雪原':x<48?'西域大漠':y>108?'南疆山水':y<68?'中原群山':'江南水鄉'}
function nearest(){return PLACES.reduce((a,b)=>dist(s,a)<dist(s,b)?a:b)}
function pass(x,y){if(x<0||y<0||x>=W||y>=H)return false;let t=terrain[y*W+x];return t!==2&&(t!==3||s.boat)}
function findPath(start,end,local=false){let w=local?22:W,h=local?16:H,prev=new Int32Array(w*h).fill(-1),q=[start.y*w+start.x],target=end.y*w+end.x;prev[q[0]]=q[0];for(let i=0;i<q.length;i++){let n=q[i];if(n===target)break;let x=n%w,y=Math.floor(n/w);for(const [dx,dy]of [[1,0],[-1,0],[0,1],[0,-1]]){let a=x+dx,b=y+dy,k=b*w+a;if(a<0||b<0||a>=w||b>=h||prev[k]!==-1||!(local?scenePass(a,b):pass(a,b)))continue;prev[k]=n;q.push(k)}}if(prev[target]===-1)return [];let out=[];for(let n=target;n!==q[0];n=prev[n])out.push({x:n%w,y:Math.floor(n/w)});return out.reverse()}
function go(x,y){if(!s||battle||$('overlay').classList.contains('open'))return;if(scene){if(!scenePass(x,y))return;path=findPath(scene,{x,y},true)}else{if(!pass(x,y)){notice(terrain[y*W+x]===3?'水域需要舟船，請至碼頭購買。':'高山無法通行，請沿道路繞行。');return}path=findPath(s,{x,y});if(!path.length&&dist(s,{x,y})>0)notice('此處無法步行抵達；海外據點需要舟船。')}}
function step(dx,dy){if(!s||battle)return;let p=scene||s,x=p.x+dx,y=p.y+dy;if(scene){if(!scenePass(x,y))return false;p.x=x;p.y=y;if(y>=15){leave();return true}}else{if(!pass(x,y))return false;s.x=x;s.y=y;s.steps++;s.days=1+Math.floor(s.steps/180);for(let place of PLACES)if(dist(s,place)<8&&!s.discovered.includes(place.id))s.discovered.push(place.id);if(s.steps%15===0)save(true)}walk+=.7;update();return true}
function interact(){if(!s||battle||$('overlay').classList.contains('open'))return;if(mapFull){mapFull=false;return}if(scene){const npc=scene.npcs.find(n=>dist(scene,n)<=2);if(npc)talk(npc);else if(scene.y>12)leave();else notice('請走近人物，或從南方出口離開。');return}const p=nearest();if(dist(s,p)>2){notice('走到據點旁兩格內，再按互動。');return}enter(p)}
function enter(p){path=[];scene={place:p,x:11,y:13,npcs:[{x:10,y:6,role:'host',name:hostName(p)},{x:15,y:10,role:'merchant',name:'行腳藥商'},{x:6,y:10,role:'traveler',name:'江湖旅人'}]};log('抵達'+p.name+'。');update()}
function leave(){scene=null;path=[];update();save(true);notice('回到大地圖。')}
function hostName(p){return p.type==='home'?'村中郎中':p.type==='sage'?'南賢':p.type==='inn'?'客棧掌櫃':p.type==='school'?'授業師父':p.type==='port'?'船家':p.type==='final'?'論劍使者':p.book>=0?'守卷人':'此地管事'}
function scenePass(x,y){return x>=1&&x<=20&&y>=1&&y<=15&&!(x>=4&&x<=17&&y>=2&&y<=4)&&!scene.npcs.some(n=>n.x===x&&n.y===y)}
function talk(n){const p=scene.place;let html=`<button class="close" onclick="closeModal()">告辭</button><div class="tag">${p.name}</div><h2>${n.name}</h2>`;if(n.role==='merchant')return shop();if(n.role==='traveler')return recruitMenu(p);
if(p.type==='home')html+=`<p>少俠遠行不易，我替各位治傷。此地療養分文不取。</p><button class="primary" onclick="rest(0)">全隊免費療傷</button>`;
else if(p.type==='sage')html+=`<p>十四天書散落各方，無須依次尋訪。先結伴、練武，再挑戰守卷人。海上兩部書要先備船。</p><div class="buttons"><button onclick="sageGift()">領取行旅盤纏</button><button onclick="journal()">查看天書線索</button><button onclick="learn('heal')">傳授回春術</button></div>`;
else if(['town','inn'].includes(p.type))html+=`<p>住店每次 25 兩，全隊恢復氣血與內力。江湖旅人也許願意加入。</p><div class="buttons"><button onclick="rest(25)">住店 · 25 兩</button><button onclick="shop()">購買藥品</button><button onclick="recruitMenu(PLACES[${p.id}])">尋訪同行者</button></div>`;
else if(p.type==='port')html+=`<p>一艘小船 150 兩，可隨身收納；抵達水邊即可行駛。買過後不必重買。</p><div class="buttons"><button ${s.boat?'disabled':''} onclick="buyBoat()">${s.boat?'已購舟船':'購船 · 150 兩'}</button><button onclick="rest(25)">碼頭休息 · 25 兩</button></div>`;
else if(p.type==='school'){let skill=p.id===18?'punch':p.id===19?'heal':p.id===20?'sword':'dragon';html+=`<p>切磋無須付費；敵方依全隊平均等級略微成長。切磋成功可提升名望與全隊經驗。</p><div class="buttons"><button class="primary" onclick="startFight('school',${p.id})">請教切磋</button><button onclick="learn('${skill}')">研讀${SKILLS.find(k=>k.id===skill).name}</button></div>`}
else if(p.type==='quest'){let done=s.books.includes(p.book),need=questLevel(p.book);html+=`<p>${p.desc}</p><p class="small">本版改編挑戰 · 建議等級 ${need} · ${done?'天書已取得':'可自由挑戰，不限順序'}<br>勝利取得《${BOOKS[p.book]}》、名望、銀兩與全隊經驗。</p><div class="buttons"><button class="primary" ${done?'disabled':''} onclick="startFight('book',${p.id})">${done?'已取得天書':'挑戰守卷人'}</button><button onclick="recruitMenu(PLACES[${p.id}])">結交此地俠客</button></div>`}
else if(p.type==='trial')html+=`<p>此處高手可反覆切磋。建議等級 ${p.id===30?10:5}。</p><button class="primary" onclick="startFight('trial',${p.id})">挑戰高手</button>`;
else if(p.type==='final')html+=`<p>集齊十四部天書後，即可參與本版最終論劍。</p><button class="primary" ${s.books.length<14?'disabled':''} onclick="startFight('final',${p.id})">${s.books.length<14?'尚缺 '+(14-s.books.length)+' 部天書':'登臺論劍'}</button>`;
show(html)}
function sageGift(){if(s.flags.gift)return notice('南賢的盤纏已領取。');s.flags.gift=true;s.gold+=200;s.inventory.herb+=4;notice('獲得 200 兩與金創藥 × 4。');update();save(true)}
function rest(cost){if(s.gold<cost)return notice('銀兩不足；小村可以免費療傷。');s.gold-=cost;for(const u of s.party){u.hp=u.maxhp;u.mp=u.maxmp}notice('全隊氣血與內力完全恢復。');update();save(true)}
function buyBoat(){if(s.boat)return;if(s.gold<150)return notice('銀兩不足。');s.gold-=150;s.boat=true;notice('已備舟船，現在可以自由渡海。');closeModal();save(true)}
function shop(){show(`<button class="close" onclick="closeModal()">離開</button><h2>行腳藥商</h2><p>銀兩：<b>${s.gold}</b> · 金創藥 ${s.inventory.herb} · 內息丹 ${s.inventory.qi}</p><div class="cards"><div class="card"><h3>金創藥</h3><p>恢復 100 點氣血並解毒，戰鬥中消耗行動。</p><button onclick="buy('herb',20)">購買一份 · 20 兩</button></div><div class="card"><h3>內息丹</h3><p>恢復 70 點內力，戰鬥中消耗行動。</p><button onclick="buy('qi',30)">購買一份 · 30 兩</button></div></div>`)}
function buy(k,n){if(s.gold<n)return notice('銀兩不足。');s.gold-=n;s.inventory[k]++;shop();update();save(true)}
function recruitMenu(p){let people=RECRUITS.filter(r=>r[2]===p.id||p.type==='inn'&&r[0]==='段譽');show(`<button class="close" onclick="closeModal()">返回</button><h2>結交群俠</h2><p class="small">最多六人同行。已加入的夥伴不會重複招募。角色能力為本版自訂，非原版數值。</p>${people.length?people.map(r=>`<div class="card"><div class="row"><h3>${r[0]}</h3><span class="badge">需要名望 ${r[3]}</span></div><p>擅長：${SKILLS.find(k=>k.id===r[1]).name}</p><button ${s.party.some(u=>u.name===r[0])||s.flags['joined'+r[0]]?'disabled':''} onclick="recruit('${r[0]}')">${s.flags['joined'+r[0]]?'已結為同伴':'邀請同行'}</button></div>`).join(''):`<p>此地暫無願意同行的俠客。河洛客棧、胡斐居、華山、古墓、丐幫總舵、擂鼓山、光明頂與俠客島可尋訪夥伴。</p>`}`)}

function startFight(kind,id){if(battle)return;lights=[];const place=PLACES[id];if(kind==='book'&&s.books.includes(place.book))return;save(true);closeModal();path=[];const avg=Math.round(s.party.reduce((n,u)=>n+u.level,0)/s.party.length);let level=kind==='book'?questLevel(place.book):kind==='final'?13:kind==='trial'?(id===30?10:5):Math.max(1,avg-1);let count=kind==='final'?5:kind==='school'?Math.min(5,s.party.length):clamp(2+Math.floor(level/3),2,5);

battle={kind,place,units,queue:[],turn:0,round:0,active:null,busy:false,obstacles:new Set(['5,2','5,6','4,4','6,4']),float:[],result:null};selectedSkill='punch';battleMode='move';mapFull=false;newRound();update();log('進入戰鬥：'+place.name+'。')}
function newRound(){if(!battle)return;battle.round++;battle.queue=battle.units.filter(u=>u.alive).sort((a,b)=>b.speed-a.speed||a.team-b.team);battle.turn=0;activate()}
function activate(){if(!battle||checkBattle())return;if(battle.turn>=battle.queue.length){newRound();return}let u=battle.queue[battle.turn];if(!u.alive){battle.turn++;activate();return}battle.active=u;u.moved=false;u.turnStart={x:u.x,y:u.y};battle.busy=u.team===1;selectedSkill=u.skills[0].id;battleMode='move';if(u.poison>0){u.poison--;damage(u,9,'毒');if(checkBattle())return;if(!u.alive){battle.turn++;activate();return}}update();if(u.team===1){let ref=battle,token=sessionToken;setTimeout(()=>{if(battle===ref&&token===sessionToken)enemyTurn()},420)}}
function checkBattle(){if(!battle)return true;if(battle.finishing)return true;let win=!battle.units.some(u=>u.team===1&&u.alive),lose=!battle.units.some(u=>u.team===0&&u.alive);if(win||lose){let b=battle;b.finishing=true;b.busy=true;setTimeout(()=>{if(battle===b)endBattle(win)},850);return true}return false}

function at(x,y){return battle.units.find(u=>u.alive&&u.x===x&&u.y===y)}
function tileFree(x,y,u){return x>=0&&y>=0&&x<11&&y<9&&!battle.obstacles.has(x+','+y)&&(!at(x,y)||at(x,y)===u)}
function reachable(u,max=3){let q=[{x:u.x,y:u.y,d:0}],seen=new Map([[u.x+','+u.y,0]]);for(let i=0;i<q.length;i++){let p=q[i];if(p.d===max)continue;for(const [dx,dy]of [[1,0],[-1,0],[0,1],[0,-1]]){let x=p.x+dx,y=p.y+dy,k=x+','+y;if(!tileFree(x,y,u)||seen.has(k))continue;seen.set(k,p.d+1);q.push({x,y,d:p.d+1})}}return seen}
function battleUI(){if(!battle)return;const u=battle.active;if(!u)return;let skill=SKILLS.find(k=>k.id===selectedSkill);$('battleActions').innerHTML=`<div class="row"><b>第 ${battle.round} 回合 · ${esc(u.name)} ${u.team?'行動中…':''}</b><span class="small">${u.hp} 氣血 / ${u.mp} 內力</span></div>${u.team?'<div class="small">敵方正在思考。</div>':`<div class="buttons"><button class="${battleMode==='move'?'active':''}" onclick="setBattleMode('move')">${u.moved?'撤回／重選移動':'移動'}</button>${u.skills.map(k=>{let a=SKILLS.find(a=>a.id===k.id);return `<button class="${battleMode==='skill'&&selectedSkill===a.id?'active':''}" ${u.mp<a.cost?'disabled':''} onclick="chooseSkill('${a.id}')">${a.name} ${k.lv}重 · ${a.cost}</button>`}).join('')}<button onclick="combatItem('herb')">補血 (${s.inventory.herb})</button><button onclick="combatItem('qi')">補氣 (${s.inventory.qi})</button><button onclick="guard()">休息</button><button onclick="retreat()">撤退</button></div><div class="small">${battleMode==='move'?'點亮格移動；出招前可按「撤回／重選移動」重新選擇。':skill.name+'：'+skill.desc+'；點選'+(skill.shape==='heal'?'隊友':'敵人')+'施展。'}</div>`}`}
function setBattleMode(m){if(!battle||battle.busy||battle.active.team!==0)return;let u=battle.active;if(m==='move'&&u.moved){u.x=u.turnStart.x;u.y=u.turnStart.y;u.moved=false;viewPan={x:0,y:0};notice('已撤回移動，可從本回合起點重選落點。')}battleMode=m;update()}

function battleClick(x,y){if(!battle||battle.busy||$('overlay').classList.contains('open'))return;let u=battle.active;if(u.team)return;if(battleMode==='move'){if(u.moved)return;let r=reachable(u,3);if(!r.has(x+','+y))return notice('無法走到該格，請點亮起的空格。');if(x===u.x&&y===u.y)return;u.x=x;u.y=y;u.moved=true;battleMode='skill';update();return}let target=at(x,y),a=SKILLS.find(a=>a.id===selectedSkill);if(!target)return notice('請點選有效目標。');if(a.shape==='heal'?target.team!==u.team:target.team===u.team)return notice('此招不能對該目標使用。');if(dist(u,target)>a.range)return notice('距離太遠，先移動靠近。');if(u.mp<a.cost)return notice('內力不足。');perform(u,target,a);if(!checkBattle())endTurn()}
function perform(u,target,a){castLight(u,target,a);u.mp-=a.cost;let training=u.skills.find(k=>k.id===a.id),lv=training?.lv||1;if(a.shape==='heal'){let amount=a.power+u.level*6+lv*5;target.hp=Math.min(target.maxhp,target.hp+amount);target.poison=0;floatText(target,'+'+amount,'#b5e3b3');log(u.name+' 以回春術治療 '+target.name+'。')}else{let targets=a.shape==='sweep'?battle.units.filter(v=>v.alive&&v.team!==u.team&&dist(v,target)<=1):[target];for(let v of targets){let value=Math.max(6,Math.round((u.atk+a.power+lv*5-v.def)*(v===target?1:.65)));damage(v,value,a.name)}log(u.name+' 施展 '+a.name+'。')}if(training){training.xp++;if(training.xp>=training.lv*4&&training.lv<10){training.xp=0;training.lv++;log(u.name+' 的 '+a.name+' 提升至第 '+training.lv+' 重。')}}}

function enemyTurn(){if(!battle)return;let u=battle.active;if(!u||u.team!==1||!u.alive)return;let enemies=battle.units.filter(v=>v.alive&&v.team===0),target=enemies.sort((a,b)=>dist(u,a)-dist(u,b)||a.hp-b.hp)[0];if(!target)return checkBattle();let reach=reachable(u,3),spots=Array.from(reach.keys()).map(k=>{let [x,y]=k.split(',').map(Number);return {x,y}}).sort((a,b)=>dist(a,target)-dist(b,target));u.x=spots[0].x;u.y=spots[0].y;let options=u.skills.map(k=>SKILLS.find(a=>a.id===k.id)).filter(a=>a.shape!=='heal'&&a.cost<=u.mp&&a.range>=dist(u,target)).sort((a,b)=>b.power-a.power);if(options.length)perform(u,target,options[0]);else{u.mp=Math.min(u.maxmp,u.mp+14);floatText(u,'調息','#a7c6c2')}if(!checkBattle())endTurn()}

if(win){s.won++;let level=kind==='book'?questLevel(p.book):kind==='final'?13:kind==='trial'?6:Math.max(1,Math.floor(s.party[0].level/2));reward=kind==='school'?45:70+level*28;xp=kind==='school'?75+level*20:100+level*45;s.gold+=reward;s.rep+=kind==='school'?1:kind==='book'?3:2;if(kind==='book'&&!s.books.includes(p.book)){s.books.push(p.book);newBook=true;let unlock={0:'blade',3:'six',7:'nine',4:'dragon'}[p.book];if(unlock&&!s.party[0].skills.some(k=>k.id===unlock))s.party[0].skills.push({id:unlock,lv:1,xp:0})}for(const u of s.party){if(u.hp<=0)u.hp=1;addXp(u,xp)}if(kind==='final')s.ended=true;

let lights=[];

function drawLights(dt,g){
ctx.save();ctx.globalCompositeOperation='lighter';

let source=iso(g,f.sx,f.sy),target=iso(g,f.tx,f.ty),sx=source.x,sy=source.y-g.t*.5,tx=target.x,ty=target.y-g.t*.5;

switch(f.id){

function prism(g,x,y,height,top,left,right){let p=iso(g,x,y),t=g.t;ctx.fillStyle=left;ctx.beginPath();ctx.moveTo(p.x-t,p.y);ctx.lineTo(p.x,p.y+t*.5);ctx.lineTo(p.x,p.y+t*.5-height);ctx.lineTo(p.x-t,p.y-height);ctx.closePath();ctx.fill();ctx.fillStyle=right;ctx.beginPath();ctx.moveTo(p.x,p.y+t*.5);ctx.lineTo(p.x+t,p.y);ctx.lineTo(p.x+t,p.y-height);ctx.lineTo(p.x,p.y+t*.5-height);ctx.closePath();ctx.fill();diamond({...g,y:g.y-height},x,y,top,'#20392d55')}
function isoBuilding(x,y,type,scale=1){ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);let g={x:0,y:0,t:29};ctx.fillStyle='#0d201c40';ctx.beginPath();ctx.ellipse(14,9,40,12,0,0,7);ctx.fill();prism(g,0,0,28,'#d3c7a4','#b39f7a','#8b8565');ctx.fillStyle='#413e30';ctx.beginPath();ctx.moveTo(6,-13);ctx.lineTo(15,-18);ctx.lineTo(15,7);ctx.lineTo(6,11);ctx.closePath();ctx.fill();let roof=type==='school'||type==='final'?'#785144':'#465d54';ctx.fillStyle=roof;ctx.beginPath();ctx.moveTo(-38,-25);ctx.lineTo(-6,-54);ctx.lineTo(39,-29);ctx.lineTo(5,-12);ctx.closePath();ctx.fill();ctx.strokeStyle='#c3b284';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(-38,-25);ctx.lineTo(5,-12);ctx.lineTo(39,-29);ctx.stroke();ctx.strokeStyle='#172e2855';ctx.lineWidth=1;for(let i=0;i<7;i++){ctx.beginPath();ctx.moveTo(-6+i*5,-53+i*3);ctx.lineTo(-34+i*6,-24+i*1.7);ctx.stroke()}for(let i=0;i<3;i++){ctx.fillStyle=i%2?'#aaa78a':'#c6bea0';ctx.beginPath();ctx.moveTo(4,13+i*3);ctx.lineTo(19,5+i*3);ctx.lineTo(24,8+i*3);ctx.lineTo(9,16+i*3);ctx.closePath();ctx.fill()}for(let k of [-1,1]){ctx.fillStyle='#c67945';ctx.fillRect(k*22,-19,4,7);let gr=ctx.createRadialGradient(k*22+2,-15,0,k*22+2,-15,12);gr.addColorStop(0,'#ffce7770');gr.addColorStop(1,'#ffce7700');ctx.fillStyle=gr;ctx.fillRect(k*22-10,-27,24,24)}ctx.restore()}
function worldGeometry(){let t=cw<600?25:33;return {t,x:cw*.5-(s.x-s.y)*t,y:ch*.48-(s.x+s.y)*t*.5}}
function worldVisible(){let g=worldGeometry(),corners=[uniso(g,-100,-100),uniso(g,cw+100,-100),uniso(g,0,ch+140),uniso(g,cw+100,ch+140)];return {g,minx:Math.max(0,Math.min(...corners.map(p=>p.x))-3),maxx:Math.min(W-1,Math.max(...corners.map(p=>p.x))+3),miny:Math.max(0,Math.min(...corners.map(p=>p.y))-3),maxy:Math.min(H-1,Math.max(...corners.map(p=>p.y))+3)}}
drawWorld=function(){let v=worldVisible(),g=v.g;ctx.fillStyle='#183b3d';ctx.fillRect(0,0,cw,ch);let objects=[];for(let y=v.miny;y<=v.maxy;y++)for(let x=v.minx;x<=v.maxx;x++){let p=iso(g,x,y);if(p.x<-100||p.x>cw+100||p.y<-100||p.y>ch+150)continue;let t=terrain[y*W+x],h=hash(x,y);diamond(g,x,y,COLORS[t]);diamond(g,x,y,`rgba(15,40,25,${h*.08})`);if(road.has(y*W+x)){ctx.strokeStyle='#c7b48c';ctx.lineWidth=g.t*.3;ctx.lineCap='round';ctx.beginPath();for(let [dx,dy]of [[1,0],[-1,0],[0,1],[0,-1]])if(road.has((y+dy)*W+x+dx)){let q=iso(g,x+dx*.5,y+dy*.5);ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y)}ctx.stroke();ctx.lineCap='butt'}if(t===3){ctx.strokeStyle='#c5ecdc35';ctx.beginPath();ctx.ellipse(p.x,p.y+Math.sin(lastFrame*.001+x)*2,g.t*.5,2,0,0,Math.PI);ctx.stroke()}if(t===2)objects.push({depth:x+y,draw:()=>{mountain(p.x-18,p.y-28,t,h);mountain(p.x-8,p.y-36,t,h)}});if(t===1&&h>.35)objects.push({depth:x+y,draw:()=>tree(p.x,p.y,h)});}
if(path.length){ctx.strokeStyle='#ffe8a0a0';ctx.lineWidth=2;ctx.setLineDash([3,6]);ctx.beginPath();let p=iso(g,s.x,s.y);ctx.moveTo(p.x,p.y);for(let a of path){p=iso(g,a.x,a.y);ctx.lineTo(p.x,p.y)}ctx.stroke();ctx.setLineDash([])}
for(let p of PLACES){let q=iso(g,p.x,p.y);if(q.x<-120||q.x>cw+120||q.y<-100||q.y>ch+130)continue;objects.push({depth:p.x+p.y,draw:()=>{isoBuilding(q.x,q.y,p.type,p.type==='town'?1.45:1.1);textAt(p.name+(p.book>=0&&s.books.includes(p.book)?' ✓':''),q.x,q.y+28,13,'#f8ebc5')}})}
objects.push({depth:s.x+s.y+.1,draw:()=>{let p=iso(g,s.x,s.y);ctx.strokeStyle='#f7dc8b';ctx.beginPath();ctx.ellipse(p.x,p.y+3,13,6,0,0,7);ctx.stroke();if(terrain[s.y*W+s.x]===3){ctx.fillStyle='#755438';ctx.beginPath();ctx.ellipse(p.x,p.y+4,23,8,-.3,0,7);ctx.fill()}person(p.x,p.y,'#284a58',walk,1.05)}});objects.sort((a,b)=>a.depth-b.depth).forEach(o=>o.draw());vignette()};
let viewZoom=1,viewPan={x:0,y:0},viewOwner=null;
function syncCamera(){let owner=battle?battle.active:scene;if(owner!==viewOwner){viewOwner=owner;viewPan={x:0,y:0}}}
function centerView(){viewPan={x:0,y:0};notice('鏡頭回到目前人物；拖曳地面可查看四周。')}
function zoomView(dir){viewZoom=clamp(viewZoom+dir*.2,.65,1.8);notice('畫面倍率 '+Math.round(viewZoom*100)+'%')}
function cameraControls(){let node=$('cameraTools');node.style.display=(scene||battle)&&!mapFull?'flex':'none';$('sceneExit').style.display=scene&&!battle?'block':'none'}
sceneGeometry=function(){syncCamera();let t=(cw<600?36:42)*viewZoom;return {t,x:cw*.5-(scene.x-scene.y)*t+viewPan.x,y:Math.max(125,ch*.50)-(scene.x+scene.y)*t*.5+viewPan.y}};
drawScene=function(){let g=sceneGeometry();ctx.fillStyle='#253c30';ctx.fillRect(0,0,cw,ch);let objects=[];for(let y=0;y<16;y++)for(let x=0;x<22;x++){let paved=x>3&&x<18&&y>4&&y<13;diamond(g,x,y,paved?((x+y)%2?'#b2ac8b':'#a39e81'):'#78956d',paved?'#63725955':null);let q=iso(g,x,y);if((x===0||x===21)&&y<14){prism(g,x,y,g.t*.9,'#a5aa90','#7b856c','#586a57')}if((x===2||x===19)&&y%4===1)objects.push({depth:x+y,draw:()=>tree(q.x,q.y,0)})}let house=iso(g,10,4);objects.push({depth:14,draw:()=>isoBuilding(house.x,house.y,scene.place.type,Math.max(.8,g.t/11))});for(let n of scene.npcs){let q=iso(g,n.x,n.y);objects.push({depth:n.x+n.y,draw:()=>{person(q.x,q.y,n.role==='host'?'#805347':n.role==='merchant'?'#8b7948':'#3e6476',0,Math.max(.55,g.t/22));textAt(n.name,q.x,q.y-36,11,'#ffe6af')}})}let q=iso(g,scene.x,scene.y);objects.push({depth:scene.x+scene.y+.1,draw:()=>person(q.x,q.y,'#284a58',walk,Math.max(.55,g.t/22))});objects.sort((a,b)=>a.depth-b.depth).forEach(o=>o.draw());let exit=iso(g,11,15);textAt('出口',exit.x,exit.y+14,12,'#ffe6af');vignette()};
battleGeometry=function(){syncCamera();let left=cw<850?160:195,t=(cw<600?34:42)*viewZoom,u=battle?.active||{x:5,y:4};return {t,x:left+(cw-left)*.5-(u.x-u.y)*t+viewPan.x,y:Math.max(130,ch*.55)-(u.x+u.y)*t*.5+viewPan.y}};
drawBattle=function(dt){let b=battle,g=battleGeometry(),u=b.active,skill=SKILLS.find(k=>k.id===selectedSkill),reach=u&&u.team===0&&battleMode==='move'&&!u.moved?reachable(u,3):new Map();let gr=ctx.createLinearGradient(0,0,0,ch);gr.addColorStop(0,'#182d2d');gr.addColorStop(1,'#46543b');ctx.fillStyle=gr;ctx.fillRect(0,0,cw,ch);let objects=[];for(let y=0;y<9;y++)for(let x=0;x<11;x++){if(y===8||x===10)prism(g,x,y,7,'#aaa48a','#6a735d','#515f50');diamond(g,x,y,(x+y)%2?'#a49e81':'#938f74','#d5c9a433');if(reach.has(x+','+y))diamond(g,x,y,'#cbe3a750','#cee8ae80');if(u&&u.team===0&&battleMode==='skill'&&dist(u,{x,y})<=skill.range)diamond(g,x,y,skill.shape==='heal'?'#8adbd33b':'#e9b5653b');if(b.obstacles.has(x+','+y))objects.push({depth:x+y,draw:()=>prism(g,x,y,g.t*.65,'#a6ae95','#697861','#4f6756')})}

出鬆動的原因。守護一座城，也包括這些無人喝彩的時刻。", "人群得知開門時辰，躁動漸漸平息。杜川說，有時把話說清楚，比增派人手更管用。"], ["長安城", "market", "驛丞秦照", "胡商沙里", "西行之前", "驛站的牆上掛著新舊不一的馬具，沙里將香料包重新縫緊。有人談西域的珍寶，有人只問下一口井有多遠，秦驛丞把兩種問話都聽在耳裡。", "秦照：往西走，路會慢慢變寬，能求助的地方卻會變少。出發時少算一點水，到了路上就可能多欠一條命。", "沙里：交易最難的不是討價還價，是讓彼此知道約定沒有換一種語言就失效。", "檢查西行的備糧清單", "幫商人核對交易記錄", "你提醒隊伍留下回程所需，秦照在路引旁添了幾處驛站名稱。準備不是膽小，是把同伴放在心上。", "誤會來自兩種計量方式，雙方終於把貨物算清。沙里說，你替他們省下的不是錢，是往後還能合作的信任。"], ["北海碼頭", "harbor", "老船主韓潮", "補網人燕七", "寒潮將至", "北風把海面吹成深灰色，岸邊的船腹一下一下碰著木樁。韓潮蹲下看纜繩，燕七用凍紅的手補網，兩人都不急著催你出航。", "韓潮：船能帶你離岸，帶不帶得回來，要看你肯不肯聽海。小船備好後可以長久使用，但每次出發仍要自己留心風浪。", "燕七：冰火島遠，看見海鳥不代表已經靠岸。許多人不是敗給大浪，是敗給最後一段自以為安全的路。", "幫船主檢查纜繩", "向補網人學辨風向", "纜繩外皮尚好，內裡卻有斷股。韓潮換了新繩，說你已經學會出海前最重要的一課。", "燕七讓你同時看旗與水紋。風與流向並不總是相同，不能只憑一個跡象下判斷。"], ["東海碼頭", "harbor", "船家陳帆", "候船客白蘋", "潮平好渡海", "碼頭邊堆著鹽袋，遠處島影在霧裡忽隱忽現。陳帆敲了敲船板，讓你聽木頭是否結實；白蘋把一封信攥在手心，問遍每一位剛靠岸的船客。", "陳帆：桃花島與俠客島各有自己的規矩。出海前買妥舟船，帶足藥品，別以為岸上的名望能替你擋浪。", "白蘋：我等的人不一定搭這一班船。可若我今天不來，又怕錯過他回來的那一次。", "協助把藥箱搬上岸", "陪候船人問清船期", "藥箱避開了漲潮的水線，陳帆指給你看遠處礁石。碼頭上的小心，正是海上的平安。", "你替白蘋問到明日的船期，她終於肯先回去歇息。等待不必變成折磨自己的辦法。"], ["黑木崖", "cliff", "崖上執事冷秋", "送飯人阿滿", "高處的影子", "峭壁投下長長陰影，吊橋在腳下輕顫。冷秋立在橋頭驗看來客的兵器，阿滿卻提著飯籃從旁邊走過，像這條令人膽寒的路只是尋常巷口。", "冷秋：此處的高手不會因你遠道而來便放水。要挑戰，先想好敗了之後還能否平靜離開；把輸贏看得太重的人，反而最容易失手。", "阿滿：站得再高的人也得吃飯。我只盼他們爭完高下，還記得橋下也有人住。", "檢查吊橋的木板", "聽送飯人談崖下生活", "你補牢一塊鬆板，冷秋的神色稍緩。來求勝的人很多，肯回頭看路的人不多。", "阿滿說起山下的菜田與井水。高處的傳說忽然有了重量，因為每一次爭鬥都可能落到別人的日子裡。"], ["擂鼓山", "bamboo", "蘇星河", "王語嫣", "棋外之人", "棋盤上的黑白子密得讓人透不過氣，盤邊卻留著一整壺未動的茶。蘇星河看棋，王語嫣看你的步法，兩人似乎各自看見了你尚未注意的破綻。", "蘇星河：落子以前總有許多選擇，落子以後便要承擔。旁觀者說得再明白，也不能替你把那顆棋收回心裡。", "王語嫣：我記得許多招式，不代表我比出招的人更懂他的難處。若你肯告訴我哪一步覺得不順，我也許能幫上忙。", "從棋局邊緣尋找活路", "向語嫣請教招式銜接", "你放下只看中央的習慣，才發現邊角尚有餘地。蘇星河示意你坐近一些。", "語嫣指出你換步時多用的一分力，並沒有要求你立刻學另一套功夫。有時改好眼前的一步，勝過背下十個名字。"], ["冰火島", "volcano", "孤島守關人", "漂流客石舟", "冰與火的岸", "黑色礁岩上覆著薄霜，山腹卻隱約透出暗紅。石舟把濕衣攤在熱石旁，守關人站在海風裡，像是早已習慣兩種截然不同的寒暖。", "守關人：孤島上沒有觀眾，贏了不會多一聲喝彩，輸了也無人替你羞辱。你若仍願切磋，才算知道自己為何練武。", "石舟：我被浪送來時，最想要的不是寶物，是一塊能坐下喘氣的乾地。別等失去日常，才想起它有多難得。", "替漂流客搭好避風處", "查看冷熱交界的礁石", "簡單的擋風棚讓火不再搖晃。石舟第一次有餘力談起回家的方向。", "裂隙藏著熱氣，你標出危險位置。守關人說，能敬畏腳下土地的人，才值得談力量。"], ["華山論劍臺", "summit", "論劍使者玄松", "記錄人葉書", "眾峰之上", "山下的路在雲裡消失，臺上只剩風、石與等待的人。十四部天書被依次放在案上，紙頁翻動的聲音很輕，卻讓你想起一路走來那些不曾被寫進書裡的面孔。", "玄松：今日論劍不是替天下人排座次，而是讓你把一路所學交代清楚。你能走到這裡，靠的不會只有一招最強的武功。", "葉書：我記過很多勝者的名字，卻常想知道他們下山後去了哪裡。若你願意，這次也請把同行者的名字一起留下。", "逐一記下同行者姓名", "回想第一日離村時的心願", "你把夥伴的名字寫在自己旁邊。葉書將紙展平，說這樣的記錄才不會把一段旅程縮成一個人的勝負。", "你想起村口的燈、陌生人遞來的茶，以及每一次被允許重新站起來。論劍尚未開始，你已知道下山後仍有值得去的地方。"]];
const THEMES={village:['#88946b','#b8a57f','well','hay'],bamboo:['#536f58','#9eaa82','bamboo','scroll'],inn:['#8b795c','#b8a17c','table','barrel'],market:['#a29170','#c7b491','stall','crate'],forest:['#5a7851','#9a9c71','tree','rock'],snow:['#cbd5cd','#a6b8b3','pine','rock'],temple:['#858976','#b4ad8e','lantern','incense'],island:['#699187','#c5bd8d','blossom','rock'],desert:['#bbaa73','#d3be83','tent','jar'],capital:['#777e72','#bbb398','banner','crate'],mountain:['#738974','#aaad93','pine','rock'],cave:['#404f4b','#737a68','crystal','rock'],garden:['#7b916a','#b8b68e','blossom','pond'],fortress:['#6d7a6a','#a39f87','banner','weapon'],camp:['#8a8a62','#b5a77b','tent','pot'],canal:['#7d9c8a','#b5b393','boat','stall'],harbor:['#547e80','#b4a782','boat','barrel'],cliff:['#586e63','#8e947c','rock','banner'],volcano:['#3f4c4d','#787771','lava','crystal'],summit:['#879b94','#c4c5ae','banner','scroll']};
function sceneDesign(id){let d=STORIES[id],theme=THEMES[d[1]],houses=[{x:5+id%4,y:3,type:PLACES[id].type},{x:15+id%3,y:3+(id%2),type:id%2?'home':'school'}];if(['cave','volcano','cliff'].includes(d[1]))houses=[];let props=[];for(let i=0;i<12;i++){let x=2+(i*7+id*3)%18,y=2+(i*3+id)%11;if(x===11||y===12||houses.some(h=>Math.abs(x-h.x)<=2&&Math.abs(y-h.y)<=2))continue;props.push({x,y,type:i%3?theme[2]:theme[3]})}let recruit=RECRUITS.find(r=>r[2]===id||id===2&&r[0]==='段譽');let npcs=[{x:9+id%3,y:6,role:'host',name:d[2],look:id},{x:17,y:9,role:'merchant',name:['蘇掌櫃','姚藥師','顧行商','何藥婆'][id%4],look:id+2},{x:5,y:9,role:'traveler',name:recruit?recruit[0]:['行腳客孟昭','旅人柳煙','鏢師鄭石','遊俠陸青'][id%4],look:id+5},{x:8,y:11,role:'witness',name:d[3],look:id+9},{x:14,y:11,role:'scribe',name:['說書人杜墨','遊方學者沈雲','採風人唐雪','抄書人葉舟'][id%4],look:id+13}];props=props.filter(p=>!npcs.some(n=>dist(n,p)<=1));return {theme,houses,props,npcs}}
const oldEnter=enter,serviceTalk=talk,oldJournal=journal;
enter=function(p){oldEnter(p);let design=sceneDesign(p.id);scene.design=design;scene.npcs=design.npcs;s.flags['visited'+p.id]=true;save(true);storyPage('arrival')};
scenePass=function(x,y){if(!scene||x<1||x>20||y<1||y>15)return false;let d=scene.design||sceneDesign(scene.place.id);return !d.houses.some(h=>Math.abs(x-h.x)<=1&&Math.abs(y-h.y)<=1)&&!scene.npcs.some(n=>n.x===x&&n.y===y)};
hostName=function(p){return STORIES[p.id][2]};
function storyPage(section='arrival',npcIndex=0){if(!scene)return;let p=scene.place,d=STORIES[p.id],done=p.book>=0&&s.books.includes(p.book),choice=s.flags['choice'+p.id],selected=scene.npcs[npcIndex]||scene.npcs[0];let title=d[4],body=d[5];if(section==='host'){title=d[2];body=d[6]}if(section==='witness'){title=d[3];body=d[7]}if(section==='aftermath'){title='此地後話';body=done?`《${BOOKS[p.book]}》已由你保管。${d[2]}再見你時，語氣比初訪少了幾分試探。${d[3]}也還記得那場交談。取書的結果已定，但這裡的人仍有自己的日子要過。你可以繼續探訪、補給，或回到大地圖尋找下一段旅程。`:p.type==='final'&&s.ended?'論劍已告一段落，玄松收起名冊，葉書卻留下空白的下一頁。你與夥伴可以繼續行走這片江湖。勝負有終點，旅程未必有。':'眼前的事情尚未全數結束。你可以先聽完此地人物的見聞，再依自己的準備決定是否切磋、邀人同行或繼續旅行。';if(choice)body+='\n\n'+d[choice===1?10:11]}
show(`<button class="close" onclick="closeModal()">回到場景</button><div class="tag">${p.name} · 原創改編篇章</div><h2>${title}</h2><div class="tabs"><button onclick="storyPage('arrival',${npcIndex})">初訪</button><button onclick="storyPage('host',${npcIndex})">${d[2]}</button><button onclick="storyPage('witness',${npcIndex})">${d[3]}</button><button onclick="storyPage('aftermath',${npcIndex})">後話</button></div><p style="white-space:pre-line;font-size:17px;line-height:2">${body}</p><div class="card"><h3>這一次，你想怎麼做？</h3>${choice?`<p>已選擇：${d[choice===1?8:9]}<br>${d[choice===1?10:11]}</p>`:`<div class="buttons"><button onclick="storyChoice(1,${npcIndex})">${d[8]}</button><button onclick="storyChoice(2,${npcIndex})">${d[9]}</button></div><p class="small">每處僅第一次選擇獲得名望 1、金創藥 1；選擇會記入江湖紀事。</p>`}</div><div class="buttons"><button class="primary" onclick="sceneService(${npcIndex})">${selected.role==='host'?'交談／切磋／辦事':selected.role==='merchant'?'買藥補給':selected.role==='traveler'?'邀請同行':'向此地主事詢問'}</button><button onclick="chronicle()">江湖紀事</button><button onclick="closeModal()">繼續探索</button></div>`)}
function storyChoice(choice,index=0){if(!scene||![1,2].includes(choice))return;let id=scene.place.id;if(s.flags['choice'+id])return; s.flags['choice'+id]=choice;s.rep++;s.inventory.herb++;save(true);update();storyPage('aftermath',index);notice('這段經歷已記錄：名望 +1、金創藥 +1。')}
talk=function(n){let i=scene.npcs.indexOf(n);storyPage(n.role==='host'?'host':n.role==='witness'?'witness':n.role==='scribe'?'aftermath':'arrival',Math.max(0,i))};
function sceneService(i){if(!scene)return;let n=scene.npcs[i]||scene.npcs[0];serviceTalk(['witness','scribe'].includes(n.role)?scene.npcs[0]:n)}
function chronicle(){show(`<button class="close" onclick="closeModal()">返回</button><h2>江湖紀事</h2><p class="small">32 地原創改編篇章；不是原版完整劇本。探訪與選擇隨存檔保留。</p><div class="cards">${STORIES.map((d,id)=>`<div class="card"><h3>${d[0]} · ${d[4]}</h3>${s.flags['visited'+id]?`<p>${d[5]}</p><p>${s.flags['choice'+id]?d[s.flags['choice'+id]===1?10:11]:'此地的選擇尚未作出。'}</p>`:'<p>尚未探訪，故事等待你親自聽見。</p>'}<button onclick="routePlace(${id})">尋路前往</button></div>`).join('')}</div>`,true)}
journal=function(){oldJournal();$('modal').insertAdjacentHTML('afterbegin','<button onclick="chronicle()">閱讀江湖紀事</button>')};
function sceneryProp(g,p){let q=iso(g,p.x,p.y),t=g.t;ctx.save();ctx.translate(q.x,q.y);ctx.scale(t/36,t/36);ctx.fillStyle='#10221935';ctx.beginPath();ctx.ellipse(4,4,17,7,0,0,7);ctx.fill();let kind=p.type;if(['tree','pine','bamboo','blossom'].includes(kind)){if(kind==='bamboo'){for(let i=-1;i<=1;i++){ctx.strokeStyle='#536e38';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(i*8,0);ctx.lineTo(i*8+3,-48);ctx.stroke();for(let j=0;j<4;j++){ctx.strokeStyle='#a6b16b';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(i*8-2,-j*11);ctx.lineTo(i*8+4,-j*11);ctx.stroke()}}}else{tree(0,0,p.x);if(kind==='pine'){ctx.fillStyle='#466c55';for(let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(0,-48+i*12);ctx.lineTo(15-i*2,-22+i*10);ctx.lineTo(-15+i*2,-22+i*10);ctx.fill()}}if(kind==='blossom'){ctx.fillStyle='#e9acb0';for(let i=0;i<11;i++){ctx.beginPath();ctx.arc(Math.sin(i*2.4)*13,-26+Math.cos(i*2.4)*10,4,0,7);ctx.fill()}}}}else if(['rock','crystal','lava'].includes(kind)){ctx.fillStyle=kind==='crystal'?'#8eb8af':kind==='lava'?'#8e4635':'#6e7c6a';ctx.beginPath();ctx.moveTo(-13,1);ctx.lineTo(-7,-22);ctx.lineTo(5,-32);ctx.lineTo(16,-3);ctx.lineTo(3,7);ctx.closePath();ctx.fill();ctx.strokeStyle=kind==='lava'?'#f7a151':'#cad4b880';ctx.beginPath();ctx.moveTo(5,-30);ctx.lineTo(2,-4);ctx.lineTo(14,0);ctx.stroke()}else if(kind==='boat'){ctx.fillStyle='#725637';ctx.beginPath();ctx.moveTo(-25,-3);ctx.lineTo(28,-10);ctx.lineTo(15,8);ctx.lineTo(-15,11);ctx.closePath();ctx.fill();ctx.strokeStyle='#bba274';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-49);ctx.stroke();ctx.fillStyle='#d7c7a3';ctx.fillRect(2,-45,22,29)}else if(kind==='banner'||kind==='lantern'){ctx.strokeStyle='#5a4b34';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-58);ctx.stroke();ctx.fillStyle=kind==='banner'?'#994f3f':'#d09b54';ctx.fillRect(1,-54,kind==='banner'?23:13,kind==='banner'?29:19);ctx.strokeStyle='#e5c681';ctx.strokeRect(4,-51,kind==='banner'?17:7,kind==='banner'?23:13)}else if(kind==='tent'||kind==='stall'){ctx.fillStyle='#b9a37c';ctx.fillRect(-19,-23,38,24);ctx.fillStyle=kind==='tent'?'#aa7353':'#62775d';ctx.beginPath();ctx.moveTo(-24,-22);ctx.lineTo(0,-47);ctx.lineTo(25,-22);ctx.closePath();ctx.fill();ctx.fillStyle='#594e39';ctx.fillRect(-5,-19,10,20)}else if(kind==='pond'){ctx.fillStyle='#5c9390';ctx.beginPath();ctx.ellipse(0,0,25,11,0,0,7);ctx.fill();ctx.strokeStyle='#d0d7ac';ctx.stroke()}else if(kind==='well'||kind==='pot'||kind==='jar'||kind==='barrel'){ctx.fillStyle=kind==='well'?'#9b9e87':'#99734e';ctx.fillRect(-11,-19,22,19);ctx.beginPath();ctx.ellipse(0,-19,11,5,0,0,7);ctx.fill();ctx.fillStyle='#3c4838';ctx.beginPath();ctx.ellipse(0,-19,7,3,0,0,7);ctx.fill();ctx.strokeStyle='#c5b78a';ctx.strokeRect(-11,-14,22,10)}else{ctx.fillStyle='#886a44';ctx.fillRect(-18,-13,36,12);ctx.fillRect(-15,-2,3,9);ctx.fillRect(13,-2,3,9);ctx.fillStyle=kind==='scroll'?'#dfd2ac':'#b4a57b';ctx.fillRect(-13,-17,25,5);if(kind==='weapon'){ctx.strokeStyle='#c3d4cf';ctx.lineWidth=2;for(let i=-10;i<=10;i+=10){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i+9,-35);ctx.stroke()}}}ctx.restore()}
function npcArt(g,n){let q=iso(g,n.x,n.y),scale=Math.max(.55,g.t/22),colors=['#334d6b','#7d4c41','#557148','#89724d','#526d71','#6b4c73','#b5aa85','#513f32'];person(q.x,q.y,colors[n.look%8],0,scale);ctx.save();ctx.translate(q.x,q.y);ctx.scale(scale,scale);if(n.look%3===0){ctx.fillStyle='#b7a879';ctx.beginPath();ctx.moveTo(-10,-34);ctx.lineTo(0,-43);ctx.lineTo(10,-34);ctx.closePath();ctx.fill()}else if(n.look%3===1){ctx.fillStyle='#d0c2a0';ctx.fillRect(-5,-36,10,3)}else{ctx.strokeStyle='#322e28';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-4,-32);ctx.lineTo(-7,-15);ctx.stroke()}ctx.restore();textAt(n.name,q.x,q.y-42*scale,12,'#fff0c3')}
drawScene=function(){let g=sceneGeometry(),d=scene.design||sceneDesign(scene.place.id),id=scene.place.id,theme=d.theme;ctx.fillStyle=theme[0];ctx.fillRect(0,0,cw,ch);let objects=[];for(let y=0;y<16;y++)for(let x=0;x<22;x++){let lane=x===11||y===12||y===7||((x+id)%7===0&&y>4);diamond(g,x,y,lane?theme[1]:theme[0],lane?'#152b2525':null);let q=iso(g,x,y);if((x===0||x===21)&&y<14&&['temple','fortress','capital'].includes(STORIES[id][1]))prism(g,x,y,g.t*.8,'#a0a38a','#6c775e','#55634f');if(!lane&&hash(x+id,y)>.85){ctx.strokeStyle='#e6dfae20';ctx.beginPath();ctx.moveTo(q.x-4,q.y);ctx.lineTo(q.x+5,q.y-2);ctx.stroke()}}for(let h of d.houses){let q=iso(g,h.x,h.y);objects.push({depth:h.x+h.y,draw:()=>isoBuilding(q.x,q.y,h.type,Math.max(.8,g.t/16))})}for(let p of d.props)objects.push({depth:p.x+p.y,draw:()=>sceneryProp(g,p)});for(let n of scene.npcs)objects.push({depth:n.x+n.y+.1,draw:()=>npcArt(g,n)});let q=iso(g,scene.x,scene.y);objects.push({depth:scene.x+scene.y+.2,draw:()=>person(q.x,q.y,'#284a58',walk,Math.max(.55,g.t/22))});objects.sort((a,b)=>a.depth-b.depth).forEach(o=>o.draw());if(['snow','volcano','island','summit'].includes(STORIES[id][1])){ctx.fillStyle=STORIES[id][1]==='volcano'?'#f5a15c90':'#ecedd09a';for(let i=0;i<26;i++){let px=(hash(i,id)*cw+lastFrame*.009)%cw,py=(hash(id,i)*ch+lastFrame*.018)%ch;ctx.fillRect(px,py,2,2)}}let e=iso(g,11,15);textAt('出口',e.x,e.y+16,13,'#ffe7b0');vignette()};

function frame(now){cameraControls();const dt=Math.min(.1,(now-lastFrame)/1000||0);lastFrame=now;if(s){if(!$('overlay').classList.contains('open')&&!battle&&!mapFull&&now-lastMove>105){let dx=(keys.ArrowRight||keys.d||padHold?.dx===1?1:0)-(keys.ArrowLeft||keys.a||padHold?.dx===-1?1:0),dy=(keys.ArrowDown||keys.s||padHold?.dy===1?1:0)-(keys.ArrowUp||keys.w||padHold?.dy===-1?1:0);if(dx||dy){path=[];step(dx,dx?0:dy);lastMove=now}else if(path.length){let p=path.shift(),from=scene||s;step(p.x-from.x,p.y-from.y);lastMove=now}}
ctx.clearRect(0,0,cw,ch);if(battle)drawBattle(dt);else if(mapFull)drawAtlas();else if(scene)drawScene();else drawWorld();}else{ctx.fillStyle='#17312b';ctx.fillRect(0,0,cw,ch);for(let i=0;i<12;i++)mountain(cw*.1+i*70,ch*.6+Math.sin(i)*30,0,i)}requestAnimationFrame(frame)}
function tapGame(e){if(!s||$('overlay').classList.contains('open'))return;let r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;if(battle){let a=battleGeometry();let hit=uniso(a,x,y);if(battleMode==='skill'){let skill=SKILLS.find(k=>k.id===selectedSkill),candidates=battle.units.filter(v=>v.alive&&(skill.shape==='heal'?v.team===battle.active.team:v.team!==battle.active.team));let picked=pickFigure(a,x,y,candidates);if(picked)hit=picked}battleClick(hit.x,hit.y);return}if(mapFull){let a=atlasGeometry(),p={x:(x-a.x)/a.scale,y:(y-a.y)/a.scale},nearest=PLACES.reduce((a,b)=>dist(p,a)<dist(p,b)?a:b);if(dist(p,nearest)<9)routePlace(nearest.id);return}if(scene){let a=sceneGeometry(),hit=uniso(a,x,y),tx=hit.x,ty=hit.y;let n=pickFigure(a,x,y,scene.npcs)||scene.npcs.find(n=>n.x===tx&&n.y===ty);if(n){if(dist(scene,n)<=2)talk(n);else{let opts=[[1,0],[-1,0],[0,1],[0,-1]].map(([dx,dy])=>({x:n.x+dx,y:n.y+dy})).filter(p=>scenePass(p.x,p.y));opts.sort((a,b)=>dist(scene,a)-dist(scene,b));if(opts.length)go(opts[0].x,opts[0].y)}}else if(tx>=0&&tx<22&&ty>=0&&ty<16)go(tx,ty);return}let hit=uniso(worldGeometry(),x,y),tx=hit.x,ty=hit.y,place=PLACES.find(p=>Math.abs(tx-p.x)<=1&&Math.abs(ty-p.y)<=1);if(place&&dist(s,place)<=2)enter(place);else if(place)go(place.x,place.y);else if(tx>=0&&ty>=0&&tx<W&&ty<H)go(tx,ty)}

function pickFigure(g,x,y,people){return people.map(v=>{let p=iso(g,v.x,v.y),dx=x-p.x,dy=y-(p.y-g.t*.6);return {v,score:(dx/(Math.max(24,g.t*.6)))**2+(dy/Math.max(30,g.t*.95))**2}}).filter(a=>a.score<=1).sort((a,b)=>a.score-b.score)[0]?.v||null}
let dragView=null;
canvas.addEventListener('pointerdown',e=>{if(!s||$('overlay').classList.contains('open'))return;syncCamera();dragView={id:e.pointerId,x:e.clientX,y:e.clientY,px:viewPan.x,py:viewPan.y,moved:false,pan:!!(scene||battle)&&!mapFull};canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!dragView||e.pointerId!==dragView.id)return;let dx=e.clientX-dragView.x,dy=e.clientY-dragView.y;if(Math.hypot(dx,dy)>9)dragView.moved=true;if(dragView.moved&&dragView.pan){path=[];viewPan.x=clamp(dragView.px+dx,-1800,1800);viewPan.y=clamp(dragView.py+dy,-1200,1200)}});
canvas.addEventListener('pointerup',e=>{if(!dragView||e.pointerId!==dragView.id)return;let tap=!dragView.moved;dragView=null;if(tap)tapGame(e)});
canvas.addEventListener('pointercancel',()=>dragView=null);
canvas.addEventListener('wheel',e=>{if((scene||battle)&&!mapFull){e.preventDefault();zoomView(e.deltaY<0?1:-1)}},{passive:false});

let padHold=null;
function stopPad(id){if(!padHold||(id!==undefined&&id!==padHold.id))return;padHold.button.classList.remove('held');padHold=null}
function pressPad(btn,e){if(e.cancelable)e.preventDefault();e.stopPropagation();if(!s||battle||$('overlay').classList.contains('open'))return;stopPad();const [dx,dy]=btn.dataset.dir.split(',').map(Number);mapFull=false;path=[];keys={};padHold={id:e.pointerId,dx,dy,button:btn};btn.classList.add('held');try{btn.setPointerCapture(e.pointerId)}catch{}step(dx,dy);lastMove=performance.now()}
for(let btn of document.querySelectorAll('[data-dir]')){const [dx,dy]=btn.dataset.dir.split(',').map(Number);btn.setAttribute('aria-label',dx===1?'向右移動':dx===-1?'向左移動':dy===1?'向下移動':'向上移動');btn.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 20V4M5 11L12 4L19 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="rotate('+(dx===1?90:dx===-1?270:dy===1?180:0)+' 12 12)"/></svg>';btn.addEventListener('pointerdown',e=>pressPad(btn,e),{passive:false});btn.addEventListener('pointermove',e=>{if(e.cancelable)e.preventDefault()},{passive:false});for(let type of ['pointerup','pointercancel','lostpointercapture'])btn.addEventListener(type,e=>stopPad(e.pointerId));}
for(let type of ['pointerup','pointercancel'])window.addEventListener(type,e=>stopPad(e.pointerId));
for(let type of ['contextmenu','selectstart','dragstart'])$('pad').addEventListener(type,e=>{e.preventDefault();e.stopPropagation()});
window.addEventListener('blur',()=>{keys={};stopPad();if(s&&!battle)save(true)});document.addEventListener('visibilitychange',()=>{keys={};stopPad();if(document.hidden&&s&&!battle)save(true)});window.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.key==='Escape'){if($('overlay').classList.contains('open')){if(s)closeModal()}else menu();return}if($('overlay').classList.contains('open'))return;const k=e.key.length===1?e.key.toLowerCase():e.key;keys[k]=true;if(k==='e'||k==='Enter')interact();if(k==='m')atlas();if(k==='p')partyMenu();if(k==='j')journal()});window.addEventListener('keyup',e=>{keys[e.key.length===1?e.key.toLowerCase():e.key]=false});window.addEventListener('resize',size);size();welcome();requestAnimationFrame(frame);
</script></body></html>
